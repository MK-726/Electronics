<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="redHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="lightHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 z" fill="#e6a700"/>
    </marker>
  </defs>
  <rect width="760" height="320" fill="#ffffff"/>
  <line x1="380" y1="20" x2="380" y2="300" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: physical 5 mm LED -->
  <text x="190" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Physical 5 mm LED</text>
  <path d="M110 150 V90 A50 50 0 0 1 210 90 V150 Z" fill="#ffd9d9" stroke="#222" stroke-width="3"/>
  <path d="M100 150 H210 V164 H100 Z" fill="#ffd9d9" stroke="#222" stroke-width="3"/>
  <line x1="210" y1="90" x2="210" y2="164" stroke="#c0392b" stroke-width="6"/>
  <!-- leads -->
  <line x1="130" y1="164" x2="130" y2="285" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <line x1="190" y1="164" x2="190" y2="225" stroke="#555" stroke-width="5" stroke-linecap="round"/>
  <text x="118" y="262" text-anchor="end" font-size="15" font-weight="bold" fill="#c0392b">Anode (+)</text>
  <text x="118" y="281" text-anchor="end" font-size="14" fill="#444">long lead</text>
  <text x="205" y="212" font-size="15" font-weight="bold" fill="#2471a3">Cathode (−)</text>
  <text x="205" y="231" font-size="14" fill="#444">short lead</text>
  <text x="225" y="125" font-size="15" font-weight="bold" fill="#c0392b">Flat side = cathode</text>
  <text x="225" y="144" font-size="14" fill="#444">(round side = anode)</text>

  <!-- RIGHT: schematic symbol -->
  <text x="570" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Schematic symbol</text>
  <g stroke="#222" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="440" y1="160" x2="520" y2="160"/>
    <line x1="585" y1="160" x2="680" y2="160"/>
    <line x1="585" y1="125" x2="585" y2="195"/>
  </g>
  <path d="M520 125 L520 195 L585 160 Z" fill="#ffd9d9" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <!-- light emission -->
  <g stroke="#e6a700" stroke-width="3" fill="none">
    <line x1="548" y1="118" x2="578" y2="86" marker-end="url(#lightHead)"/>
    <line x1="570" y1="126" x2="600" y2="94" marker-end="url(#lightHead)"/>
  </g>
  <text x="480" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">A (anode)</text>
  <text x="640" y="146" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">C (cathode)</text>
  <text x="480" y="192" text-anchor="middle" font-size="26" font-weight="bold" fill="#c0392b">+</text>
  <text x="640" y="194" text-anchor="middle" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <line x1="470" y1="235" x2="650" y2="235" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="560" y="262" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Conventional current flows A → C</text>
</svg>