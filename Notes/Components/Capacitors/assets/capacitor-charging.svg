<text x="74" y="172" font-size="18" font-weight="bold" fill="#c0392b">+</text>
<text x="74" y="206" font-size="22" font-weight="bold" fill="#2471a3">−</text>
<line x1="75" y1="264" x2="128" y2="264" stroke="#2471a3" stroke-width="3" marker-end="url(#blueHead)"/>
<line x1="128" y1="84" x2="75" y2="84" stroke="#2471a3" stroke-width="3" marker-end="url(#blueHead)"/>
<text x="150" y="180" text-anchor="middle" font-size="12" font-style="italic" fill="#8a6d3b">dielectric</text>
<circle cx="112" cy="202" r="6" fill="#2471a3"/>
<text x="112" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="131" cy="202" r="6" fill="#2471a3"/>
<text x="131" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="150" cy="202" r="6" fill="#2471a3"/>
<text x="150" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="169" cy="202" r="6" fill="#2471a3"/>
<text x="169" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="188" cy="202" r="6" fill="#2471a3"/>
<text x="188" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<text x="150" y="305" text-anchor="middle" font-size="14" fill="#444">Current stops when the capacitor</text>
<text x="150" y="324" text-anchor="middle" font-size="14" fill="#444">voltage equals the battery voltage</text>
<text x="450" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">2. Charged</text>
<text x="450" y="52" text-anchor="middle" font-size="14" fill="#444">Energy stays stored</text>
<rect x="400" y="152" width="100" height="44" fill="#ffe8c7" stroke="#e0b080" stroke-width="1"/>
<rect x="400" y="140" width="100" height="12" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="400" y="196" width="100" height="12" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M450 140 V100 H385"/><path d="M450 208 V248 H385"/></g>
<circle cx="385" cy="100" r="5" fill="#ffffff" stroke="#b87333" stroke-width="3"/>
<circle cx="385" cy="248" r="5" fill="#ffffff" stroke="#b87333" stroke-width="3"/>
<line x1="425" y1="158" x2="425" y2="190" stroke="#7d3c98" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#purpHead)"/>
<line x1="450" y1="158" x2="450" y2="190" stroke="#7d3c98" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#purpHead)"/>
<line x1="475" y1="158" x2="475" y2="190" stroke="#7d3c98" stroke-width="2.5" stroke-dasharray="4 3" marker-end="url(#purpHead)"/>
<text x="508" y="178" font-size="12" font-weight="bold" fill="#7d3c98">electric field</text>
<circle cx="412" cy="202" r="6" fill="#2471a3"/>
<text x="412" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="431" cy="202" r="6" fill="#2471a3"/>
<text x="431" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="450" cy="202" r="6" fill="#2471a3"/>
<text x="450" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="469" cy="202" r="6" fill="#2471a3"/>
<text x="469" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="488" cy="202" r="6" fill="#2471a3"/>
<text x="488" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<text x="450" y="305" text-anchor="middle" font-size="14" fill="#444">Plates are oppositely charged:</text>
<text x="450" y="324" text-anchor="middle" font-size="14" fill="#444">a voltage difference remains</text>
<text x="750" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">3. Discharging</text>
<text x="750" y="52" text-anchor="middle" font-size="14" fill="#444">The lamp gives electrons a path</text>
<rect x="700" y="152" width="100" height="44" fill="#ffe8c7" stroke="#e0b080" stroke-width="1"/>
<rect x="700" y="140" width="100" height="12" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="700" y="196" width="100" height="12" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M750 140 V100 H650 V151"/><path d="M750 208 V248 H650 V199"/></g>
<circle cx="650" cy="175" r="24" fill="#fff3b0" stroke="#222" stroke-width="3"/>
<path d="M641 187 V176 C641 165 659 165 659 176 V187" stroke="#222" stroke-width="2.5" fill="none"/>
<line x1="630" y1="155" x2="622" y2="147" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
<line x1="670" y1="155" x2="678" y2="147" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
<line x1="630" y1="195" x2="622" y2="203" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
<line x1="670" y1="195" x2="678" y2="203" stroke="#f1c40f" stroke-width="3" stroke-linecap="round"/>
<line x1="662" y1="84" x2="714" y2="84" stroke="#2471a3" stroke-width="3" marker-end="url(#blueHead)"/>
<line x1="730" y1="264" x2="678" y2="264" stroke="#2471a3" stroke-width="3" marker-end="url(#blueHead)"/>
<circle cx="731" cy="202" r="6" fill="#2471a3"/>
<text x="731" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<circle cx="769" cy="202" r="6" fill="#2471a3"/>
<text x="769" y="151" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+</text>
<text x="750" y="305" text-anchor="middle" font-size="14" fill="#444">The lamp lights briefly until the plates</text>
<text x="750" y="324" text-anchor="middle" font-size="14" fill="#444">equalise and the voltage falls to 0</text>
<circle cx="80" cy="378" r="6" fill="#2471a3"/>
<text x="92" y="383" font-size="14" fill="#444">electron (negative)</text>
<text x="270" y="384" font-size="18" font-weight="bold" fill="#c0392b">+</text>
<text x="284" y="383" font-size="14" fill="#444">plate that lost electrons</text>
<line x1="520" y1="378" x2="560" y2="378" stroke="#2471a3" stroke-width="3" marker-end="url(#blueHead)"/>
<text x="572" y="383" font-size="14" fill="#444">electron flow (− to +)</text>
</svg>