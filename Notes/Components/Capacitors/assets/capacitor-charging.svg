<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 410" width="900" height="410" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="blueHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#2471a3"/></marker><marker id="purpHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#7d3c98"/></marker></defs>
<rect width="900" height="410" fill="#ffffff"/>
<line x1="300" y1="15" x2="300" y2="345" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="600" y1="15" x2="600" y2="345" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>
<text x="150" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">1. Charging</text>
<text x="150" y="52" text-anchor="middle" font-size="14" fill="#444">Electrons pile up on one plate</text>
<rect x="100" y="152" width="100" height="44" fill="#ffe8c7" stroke="#e0b080" stroke-width="1"/>
<rect x="100" y="140" width="100" height="12" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<rect x="100" y="196" width="100" height="12" fill="#cfd8dc" stroke="#555" stroke-width="2"/>
<g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M150 140 V100 H50 V165"/><path d="M150 208 V248 H50 V195"/></g>
<line x1="34" y1="165" x2="66" y2="165" stroke="#222" stroke-width="5" stroke-linecap="round"/>
