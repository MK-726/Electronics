<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 385" width="820" height="385" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="820" height="385" fill="#ffffff"/>
  <line x1="270" y1="20" x2="270" y2="355" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="605" y1="20" x2="605" y2="355" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- real capacitor -->
  <text x="135" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Real capacitor</text>
  <rect x="55" y="80" width="80" height="140" rx="6" fill="#1f4e79"/>
  <rect x="55" y="80" width="20" height="140" rx="4" fill="#cfd8dc"/>
  <text x="65" y="118" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">−</text>
  <text x="65" y="158" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f4e79">−</text>
  <text x="107" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1000 µF</text>
  <text x="107" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">25 V</text>
  <line x1="66" y1="220" x2="66" y2="275" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="220" x2="120" y2="295" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <text x="66" y="318" text-anchor="middle" font-size="22" font-weight="bold" fill="#2471a3">−</text>
  <text x="120" y="318" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">+</text>
  <line x1="136" y1="141" x2="158" y2="141" stroke="#555" stroke-width="2"/>
  <text x="162" y="145" font-size="13" font-weight="bold" fill="#222">Capacitance</text>
  <line x1="136" y1="161" x2="158" y2="161" stroke="#555" stroke-width="2"/>
  <text x="162" y="165" font-size="13" font-weight="bold" fill="#222">Max voltage</text>
  <text x="135" y="348" text-anchor="middle" font-size="13" fill="#444">Stripe marks the negative side</text>

  <!-- inside -->
  <text x="437" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Inside</text>
  <rect x="340" y="125" width="150" height="14" fill="#b0bec5" stroke="#455a64" stroke-width="2"/>
  <rect x="340" y="139" width="150" height="44" fill="#ffe0b2" stroke="#e0b080" stroke-width="1.5"/>
  <rect x="340" y="183" width="150" height="14" fill="#b0bec5" stroke="#455a64" stroke-width="2"/>
  <line x1="415" y1="125" x2="415" y2="80" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <line x1="415" y1="197" x2="415" y2="240" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <text x="415" y="68" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">+</text>
  <text x="415" y="264" text-anchor="middle" font-size="24" font-weight="bold" fill="#2471a3">−</text>
  <text x="500" y="137" font-size="13" font-weight="bold" fill="#222">Metal plate</text>
  <text x="500" y="156" font-size="13" font-weight="bold" fill="#222">Dielectric</text>
  <text x="500" y="172" font-size="12" fill="#444">(e.g. ceramic)</text>
  <text x="500" y="195" font-size="13" font-weight="bold" fill="#222">Metal plate</text>
  <text x="437" y="300" text-anchor="middle" font-size="14" fill="#444">The dielectric separates the plates,</text>
  <text x="437" y="319" text-anchor="middle" font-size="14" fill="#444">so electrons cannot pass through</text>

  <!-- symbols -->
  <text x="712" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Schematic symbols</text>
  <g stroke="#222" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="640" y1="115" x2="700" y2="115"/>
    <line x1="700" y1="88" x2="700" y2="142"/>
    <line x1="724" y1="88" x2="724" y2="142"/>
    <line x1="724" y1="115" x2="784" y2="115"/>
    <line x1="640" y1="235" x2="700" y2="235"/>
    <line x1="700" y1="208" x2="700" y2="262"/>
    <path d="M722 208 Q742 235 722 262"/>
    <line x1="732" y1="235" x2="784" y2="235"/>
  </g>
  <text x="712" y="172" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Non-polarised</text>
  <text x="712" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Polarised</text>
  <text x="712" y="308" text-anchor="middle" font-size="13" fill="#444">(+ marks the positive side)</text>
  <text x="676" y="222" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">+</text>
</svg>
