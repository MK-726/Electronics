<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 435" width="800" height="435" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="800" height="435" fill="#ffffff"/>
  <line x1="400" y1="15" x2="400" y2="385" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: voltage check -->
  <text x="200" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">1. Check the stored voltage</text>
  <text x="200" y="50" text-anchor="middle" font-size="14" fill="#444">DC volts: red to +, black to −</text>
  <rect x="130" y="66" width="140" height="82" rx="10" fill="#3a3f47"/>
  <rect x="144" y="76" width="112" height="34" rx="4" fill="#cfe8cf" stroke="#888" stroke-width="1.5"/>
  <text x="200" y="101" text-anchor="middle" font-size="21" font-weight="bold" font-family="Courier New, monospace" fill="#1b3a1b">4.80 V</text>
  <text x="200" y="130" text-anchor="middle" font-size="12" fill="#dddddd">DC volts</text>
  <circle cx="165" cy="150" r="6" fill="#111111"/>
  <circle cx="235" cy="150" r="6" fill="#c0392b"/>
  <path d="M165 156 C100 180 100 320 156 342" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M235 156 C300 180 300 330 212 352" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="145" y="215" width="80" height="88" rx="6" fill="#1f4e79"/>
  <rect x="145" y="215" width="18" height="88" rx="4" fill="#cfd8dc"/>
  <text x="154" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">−</text>
  <text x="154" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">−</text>
  <text x="194" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1000 µF</text>
  <text x="194" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">25 V</text>
  <line x1="156" y1="303" x2="156" y2="342" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="212" y1="303" x2="212" y2="352" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <circle cx="156" cy="342" r="5" fill="#111111"/>
  <circle cx="212" cy="352" r="5" fill="#c0392b"/>
  <text x="146" y="376" text-anchor="middle" font-size="20" font-weight="bold" fill="#2471a3">−</text>
  <text x="222" y="378" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">+</text>
  <text x="200" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Several volts or more? Discharge through a resistor</text>
  <text x="200" y="426" text-anchor="middle" font-size="14" fill="#444">until the reading is in the millivolt range</text>

  <!-- RIGHT: capacitance -->
  <text x="600" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">2. Measure the capacitance</text>
  <text x="600" y="50" text-anchor="middle" font-size="14" fill="#444">Capacitor mode: red to +, black to −</text>
  <rect x="530" y="66" width="140" height="82" rx="10" fill="#3a3f47"/>
  <rect x="544" y="76" width="112" height="34" rx="4" fill="#cfe8cf" stroke="#888" stroke-width="1.5"/>
  <text x="600" y="101" text-anchor="middle" font-size="21" font-weight="bold" font-family="Courier New, monospace" fill="#1b3a1b">946 µF</text>
  <text x="600" y="130" text-anchor="middle" font-size="12" fill="#dddddd">capacitance mode</text>
  <circle cx="565" cy="150" r="6" fill="#111111"/>
  <circle cx="635" cy="150" r="6" fill="#c0392b"/>
  <path d="M565 156 C500 180 500 320 556 342" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M635 156 C700 180 700 330 612 352" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="545" y="215" width="80" height="88" rx="6" fill="#1f4e79"/>
  <rect x="545" y="215" width="18" height="88" rx="4" fill="#cfd8dc"/>
  <text x="554" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">−</text>
  <text x="554" y="275" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f4e79">−</text>
  <text x="594" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1000 µF</text>
  <text x="594" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">25 V</text>
  <line x1="556" y1="303" x2="556" y2="342" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <line x1="612" y1="303" x2="612" y2="352" stroke="#888" stroke-width="4" stroke-linecap="round"/>
  <circle cx="556" cy="342" r="5" fill="#111111"/>
  <circle cx="612" cy="352" r="5" fill="#c0392b"/>
  <text x="546" y="376" text-anchor="middle" font-size="20" font-weight="bold" fill="#2471a3">−</text>
  <text x="622" y="378" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">+</text>
  <text x="600" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">Rated 1000 µF, reads about 946 µF</text>
  <text x="600" y="426" text-anchor="middle" font-size="14" fill="#444">Close to the stated value, but not exact</text>
</svg>
