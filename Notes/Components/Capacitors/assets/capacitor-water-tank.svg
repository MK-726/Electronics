<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 355" width="800" height="355" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="flowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#1b4f72"/></marker></defs>
<rect width="800" height="355" fill="#ffffff"/>
<line x1="400" y1="15" x2="400" y2="295" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>
<text x="195" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e8449">Valve open</text>
<text x="195" y="52" text-anchor="middle" font-size="14" fill="#444">Tank fills while water flows out</text>
<rect x="190" y="72" width="110" height="178" fill="#ffffff" stroke="#555" stroke-width="4"/>
<rect x="192" y="130" width="106" height="118" fill="#aed6f1"/>
