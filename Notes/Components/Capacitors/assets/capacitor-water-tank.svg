<text x="245" y="116" text-anchor="middle" font-size="13" fill="#444">(= capacitor)</text>
<rect x="20" y="110" width="172" height="26" fill="#aed6f1" stroke="#2471a3" stroke-width="3"/>
<polygon points="70,105 70,141 94,123" fill="#27ae60" stroke="#222" stroke-width="2"/>
<polygon points="118,105 118,141 94,123" fill="#27ae60" stroke="#222" stroke-width="2"/>
<line x1="94" y1="123" x2="94" y2="86" stroke="#222" stroke-width="4"/>
<line x1="78" y1="86" x2="110" y2="86" stroke="#222" stroke-width="5" stroke-linecap="round"/>
<line x1="28" y1="123" x2="64" y2="123" stroke="#1b4f72" stroke-width="3" marker-end="url(#flowHead)"/>
<line x1="124" y1="123" x2="180" y2="123" stroke="#1b4f72" stroke-width="3" marker-end="url(#flowHead)"/>
<rect x="298" y="222" width="72" height="26" fill="#aed6f1" stroke="#2471a3" stroke-width="3"/>
<line x1="312" y1="235" x2="362" y2="235" stroke="#1b4f72" stroke-width="3" marker-end="url(#flowHead)"/>
<text x="334" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f72">steady flow out</text>
<text x="595" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#c0392b">Valve closed</text>
<text x="595" y="52" text-anchor="middle" font-size="14" fill="#444">Tank keeps water flowing until empty</text>
<rect x="590" y="72" width="110" height="178" fill="#ffffff" stroke="#555" stroke-width="4"/>
<rect x="592" y="190" width="106" height="58" fill="#aed6f1"/>
<text x="645" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Tank</text>
<text x="645" y="116" text-anchor="middle" font-size="13" fill="#444">(= capacitor)</text>
<rect x="420" y="110" width="172" height="26" fill="#eeeeee" stroke="#2471a3" stroke-width="3"/>
<polygon points="470,105 470,141 494,123" fill="#c0392b" stroke="#222" stroke-width="2"/>
<polygon points="518,105 518,141 494,123" fill="#c0392b" stroke="#222" stroke-width="2"/>
<line x1="494" y1="123" x2="494" y2="86" stroke="#222" stroke-width="4"/>
<line x1="478" y1="86" x2="510" y2="86" stroke="#222" stroke-width="5" stroke-linecap="round"/>
<text x="494" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">no water in</text>
<rect x="698" y="222" width="72" height="26" fill="#aed6f1" stroke="#2471a3" stroke-width="3"/>
<line x1="712" y1="235" x2="762" y2="235" stroke="#1b4f72" stroke-width="3" marker-end="url(#flowHead)"/>
<text x="734" y="274" text-anchor="middle" font-size="13" font-weight="bold" fill="#1b4f72">steady flow out</text>
<text x="400" y="322" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Water = charge   |   Tank = capacitor   |   Valve = supply switch</text>
<text x="400" y="344" text-anchor="middle" font-size="14" fill="#444">The tank smooths out interruptions in the supply.</text>
</svg>