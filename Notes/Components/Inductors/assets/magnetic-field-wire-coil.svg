<text x="505" y="159" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">current in</text>
<text x="690" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Inside the coil the field runs from S to N;</text>
<text x="690" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">outside it loops back from N to S.</text>
<text x="690" y="395" text-anchor="middle" font-size="12" font-weight="normal" fill="#555">Curl your fingers along the current: the thumb points to N</text>
<text x="690" y="413" text-anchor="middle" font-size="12" font-weight="normal" fill="#555">More turns, more current, or an iron core: a stronger field</text>
