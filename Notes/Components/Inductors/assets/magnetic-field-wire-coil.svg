<text x="738" y="337" text-anchor="start" font-size="13" font-weight="bold" fill="#2471a3">magnetic field</text>
<text x="690" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Inside the coil the field runs from S to N;</text>
<text x="690" y="391" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">outside it loops back from N to S.</text>
<text x="690" y="415" text-anchor="middle" font-size="12" font-weight="normal" fill="#555">Curl your fingers along the current: the thumb points to N</text>
<text x="690" y="433" text-anchor="middle" font-size="12" font-weight="normal" fill="#555">More turns, more current, or an iron core: a stronger field</text>
