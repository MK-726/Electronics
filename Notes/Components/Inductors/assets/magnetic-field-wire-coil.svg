<text x="215" y="371" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">fingers curl the way the field wraps around.</text>
<text x="215" y="395" text-anchor="middle" font-size="12" font-weight="normal" fill="#555">Dot = current coming out of the page (toward you)</text>
