<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="rh" markerWidth="10" markerHeight="10" refX="8" refY="5.0" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.0 L0 10 z" fill="#c0392b"/></marker></defs>
<rect width="980" height="430" fill="#ffffff"/>
<line x1="327" y1="15" x2="327" y2="330" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<line x1="654" y1="15" x2="654" y2="330" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<text x="165" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Current is rising</text>
<path d="M75 150 H99 A16.50 16.50 0 0 1 132.00 150 A16.50 16.50 0 0 1 165.00 150 A16.50 16.50 0 0 1 198.00 150 A16.50 16.50 0 0 1 231.00 150 H255" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

<line x1="15" y1="150" x2="75" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="255" y1="150" x2="315" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="25" y1="132" x2="65" y2="132" stroke="#c0392b" stroke-width="3.5" marker-end="url(#rh)"/>
<text x="45" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">current</text>
<circle cx="99" cy="200" r="15" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
<text x="99" y="207" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">+</text>
<circle cx="231" cy="200" r="15" fill="#ffffff" stroke="#2471a3" stroke-width="3"/>
<text x="231" y="207" text-anchor="middle" font-size="20" font-weight="bold" fill="#2471a3">−</text>
<text x="165" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">voltage</text>
<text x="165" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2471a3">▲ magnetic field growing</text>
<text x="165" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The inductor pushes back (back EMF).</text>
<text x="165" y="270" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">It acts like a load and stores energy</text>
<text x="165" y="288" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">as the magnetic field grows.</text>
<text x="492" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Current is steady</text>
<path d="M402 150 H426 A16.50 16.50 0 0 1 459.00 150 A16.50 16.50 0 0 1 492.00 150 A16.50 16.50 0 0 1 525.00 150 A16.50 16.50 0 0 1 558.00 150 H582" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

<line x1="342" y1="150" x2="402" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="582" y1="150" x2="642" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="352" y1="132" x2="392" y2="132" stroke="#c0392b" stroke-width="3.5" marker-end="url(#rh)"/>
<text x="372" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">current</text>
<text x="492" y="206" text-anchor="middle" font-size="20" font-weight="bold" fill="#555">0 V</text>
<text x="492" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2471a3">■ magnetic field steady</text>
<text x="492" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">No voltage across an ideal inductor.</text>
<text x="492" y="270" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">It acts like a plain piece of wire</text>
<text x="492" y="288" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">(the field is constant, nothing changes).</text>
<text x="819" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Current is falling</text>
<path d="M729 150 H753 A16.50 16.50 0 0 1 786.00 150 A16.50 16.50 0 0 1 819.00 150 A16.50 16.50 0 0 1 852.00 150 A16.50 16.50 0 0 1 885.00 150 H909" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

<line x1="669" y1="150" x2="729" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="909" y1="150" x2="969" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="679" y1="132" x2="719" y2="132" stroke="#c0392b" stroke-width="3.5" marker-end="url(#rh)"/>
<text x="699" y="122" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">current</text>
<circle cx="753" cy="200" r="15" fill="#ffffff" stroke="#2471a3" stroke-width="3"/>
<text x="753" y="207" text-anchor="middle" font-size="20" font-weight="bold" fill="#2471a3">−</text>
<circle cx="885" cy="200" r="15" fill="#ffffff" stroke="#c0392b" stroke-width="3"/>
<text x="885" y="207" text-anchor="middle" font-size="20" font-weight="bold" fill="#c0392b">+</text>
<text x="819" y="206" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#555">voltage</text>
<text x="819" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#2471a3">▼ magnetic field collapsing</text>
<text x="819" y="250" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The inductor pushes current on.</text>
<text x="819" y="270" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">It acts like a source and releases energy</text>
<text x="819" y="288" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">as the magnetic field collapses.</text>
<rect x="150" y="345" width="680" height="70" rx="10" fill="#f4f6f8" stroke="#cfd6dd" stroke-width="1.5" />
<text x="490" y="372" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Voltage across an inductor = L × (how fast the current is changing)</text>
<text x="490" y="396" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">The inductor always opposes the change (Lenz’s law). Polarity shown for current entering the left end.</text>
</svg>