<text x="380" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">Inductor</text>
<text x="740" y="325" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Capacitor</text>
<text x="60" y="367" text-anchor="start" font-size="14" font-weight="bold" fill="#444">Stores energy in</text>
<text x="380" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">a magnetic field</text>
<text x="740" y="367" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">an electric field</text>
<rect x="40" y="380" width="880" height="38" rx="0" fill="#f8f9fa" stroke="none" stroke-width="2" />
<text x="60" y="405" text-anchor="start" font-size="14" font-weight="bold" fill="#444">Resists a change in</text>
<text x="380" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">current</text>
<text x="740" y="405" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">voltage</text>
<text x="60" y="443" text-anchor="start" font-size="14" font-weight="bold" fill="#444">With steady DC</text>
<text x="380" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">acts like a wire (a short)</text>
<text x="740" y="443" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">blocks it (open circuit)</text>
<rect x="40" y="456" width="880" height="38" rx="0" fill="#f8f9fa" stroke="none" stroke-width="2" />
<text x="60" y="481" text-anchor="start" font-size="14" font-weight="bold" fill="#444">With AC</text>
<text x="380" y="481" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">current lags voltage by 90°</text>
<text x="740" y="481" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">current leads voltage by 90°</text>
<text x="60" y="519" text-anchor="start" font-size="14" font-weight="bold" fill="#444">Unit</text>
<text x="380" y="519" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">henry (H)</text>
<text x="740" y="519" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">farad (F)</text>
