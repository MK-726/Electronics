<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="960" height="520" fill="#ffffff"/>
<line x1="480" y1="15" x2="480" y2="450" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<text x="240" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Inductors in series</text>
<line x1="25" y1="150" x2="60" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<path d="M60 150 H70 A20.00 20.00 0 0 1 110.00 150 A20.00 20.00 0 0 1 150.00 150 A20.00 20.00 0 0 1 190.00 150 H200" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="200" y1="150" x2="235" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<path d="M235 150 H245 A20.00 20.00 0 0 1 285.00 150 A20.00 20.00 0 0 1 325.00 150 A20.00 20.00 0 0 1 365.00 150 H375" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="375" y1="150" x2="440" y2="150" stroke="#222" stroke-width="4" stroke-linecap="round" />
<text x="130" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">L1 = 10 mH</text>
<text x="305" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">L2 = 22 mH</text>
<rect x="50" y="200" width="380" height="70" rx="10" fill="#eef6ff" stroke="#b6d4f2" stroke-width="1.5" />
<text x="240" y="228" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Ltotal = L1 + L2 + L3 + …</text>
<text x="240" y="254" text-anchor="middle" font-size="17" font-weight="bold" fill="#2471a3">10 mH + 22 mH = 32 mH</text>
<text x="240" y="304" text-anchor="middle" font-size="14" font-weight="normal" fill="#444">More turns of wire in a row → more inductance.</text>
<text x="240" y="326" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The total is bigger than any single inductor.</text>
<text x="720" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Inductors in parallel</text>
<line x1="505" y1="180" x2="540" y2="180" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="900" y1="180" x2="935" y2="180" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="540" y1="125" x2="540" y2="235" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="900" y1="125" x2="900" y2="235" stroke="#222" stroke-width="4" stroke-linecap="round" />
<circle cx="540" cy="180" r="5" fill="#222" stroke="none" stroke-width="2"/>
<circle cx="900" cy="180" r="5" fill="#222" stroke="none" stroke-width="2"/>
<line x1="540" y1="125" x2="580" y2="125" stroke="#222" stroke-width="4" stroke-linecap="round" />
<path d="M580 125 H590 A32.50 32.50 0 0 1 655.00 125 A32.50 32.50 0 0 1 720.00 125 A32.50 32.50 0 0 1 785.00 125 A32.50 32.50 0 0 1 850.00 125 H860" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="860" y1="125" x2="900" y2="125" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="540" y1="235" x2="580" y2="235" stroke="#222" stroke-width="4" stroke-linecap="round" />
<path d="M580 235 H590 A32.50 32.50 0 0 1 655.00 235 A32.50 32.50 0 0 1 720.00 235 A32.50 32.50 0 0 1 785.00 235 A32.50 32.50 0 0 1 850.00 235 H860" fill="none" stroke="#222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<line x1="860" y1="235" x2="900" y2="235" stroke="#222" stroke-width="4" stroke-linecap="round" />
<text x="720" y="78" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">L1 = 6 mH</text>
<text x="720" y="274" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">L2 = 3 mH</text>
<rect x="510" y="298" width="420" height="100" rx="10" fill="#fff4ea" stroke="#f0c9a0" stroke-width="1.5" />
<text x="720" y="324" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">1 ÷ Ltotal = 1 ÷ L1 + 1 ÷ L2 + …</text>
<text x="720" y="350" text-anchor="middle" font-size="17" font-weight="bold" fill="#c0392b">1 ÷ 6 + 1 ÷ 3 = 1 ÷ 2   →   Ltotal = 2 mH</text>
<text x="720" y="378" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Two only: (L1 × L2) ÷ (L1 + L2) = 18 ÷ 9 = 2 mH</text>
<text x="720" y="424" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">The total is smaller than the smallest inductor.</text>
<text x="720" y="446" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Two equal inductors in parallel give half: 10 mH ∥ 10 mH = 5 mH.</text>
<rect x="40" y="462" width="880" height="44" rx="8" fill="#f4f6f8" stroke="#cfd6dd" stroke-width="1.5" />
<text x="480" y="481" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">These are the same rules as for resistors. They assume the coils do not share a magnetic field</text>
<text x="480" y="498" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">(keep them apart or shielded), otherwise their fields interact and the totals change.</text>
</svg>