<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="940" height="540" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="rh" markerWidth="10" markerHeight="10" refX="8" refY="5.0" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.0 L0 10 z" fill="#c0392b"/></marker><marker id="gh" markerWidth="10" markerHeight="10" refX="8" refY="5.0" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.0 L0 10 z" fill="#222"/></marker></defs>
<rect width="940" height="540" fill="#ffffff"/>
<line x1="470" y1="15" x2="470" y2="445" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<text x="235" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Magnet coming in</text>
<text x="235" y="49" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">The changing field induces a current in the coil.</text>
<text x="235" y="66" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">Its field pushes back: like poles repel.</text>
