<text x="325" y="211" text-anchor="start" font-size="14" font-weight="bold" fill="#c0392b">coil top = N</text>
<text x="325" y="301" text-anchor="start" font-size="14" font-weight="bold" fill="#2471a3">coil bottom = S</text>
<rect x="211.0" y="92" width="48" height="48.0" rx="0" fill="#5b9bd5" stroke="#1f4e79" stroke-width="2" />
<rect x="211.0" y="140.0" width="48" height="48.0" rx="0" fill="#e57373" stroke="#8e2222" stroke-width="2" />
<text x="235" y="124.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">S</text>
<text x="235" y="172.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">N</text>
<line x1="295" y1="110" x2="295" y2="165" stroke="#222" stroke-width="3.5" marker-end="url(#gh)"/>
<text x="305" y="140" text-anchor="start" font-size="13" font-weight="bold" fill="#222">moving down</text>


<text x="171" y="245" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">induced</text>
<text x="171" y="261" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">current</text>
<text x="705" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Magnet moving away</text>
<text x="705" y="49" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">The induced current now reverses.</text>
<text x="705" y="66" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">Its field pulls back: it holds the magnet.</text>
