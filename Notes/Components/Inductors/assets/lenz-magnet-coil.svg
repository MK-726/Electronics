<rect x="681.0" y="383.0" width="48" height="48.0" rx="0" fill="#e57373" stroke="#8e2222" stroke-width="2" />
<text x="705" y="367.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">S</text>
<text x="705" y="415.0" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">N</text>
<line x1="765" y1="350" x2="765" y2="405" stroke="#222" stroke-width="3.5" marker-end="url(#gh)"/>
<text x="775" y="380" text-anchor="start" font-size="13" font-weight="bold" fill="#222">moving down</text>
<text x="641" y="245" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">induced</text>
<text x="641" y="261" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">current</text>
<rect x="60" y="462" width="820" height="58" rx="10" fill="#f4f6f8" stroke="#cfd6dd" stroke-width="1.5" />
<text x="470" y="485" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Lenz’s law: the induced current always opposes the change that causes it.</text>
<text x="470" y="505" text-anchor="middle" font-size="12.5" font-weight="normal" fill="#444">With two LEDs wired in opposite directions, one lights as the magnet goes in and the other as it comes out.</text>
</svg>