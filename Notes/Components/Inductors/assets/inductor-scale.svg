<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Inductance scale: nanohenries, microhenries, millihenries</text>
<rect x="60.0" y="60" width="293.3333333333333" height="70" rx="0" fill="#d6eaf8" stroke="#9aa5b1" stroke-width="1.5" />
<text x="206.66666666666666" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1b4f72">nanohenry (nH) range</text>
<rect x="353.3333333333333" y="60" width="293.3333333333333" height="70" rx="0" fill="#d5f5e3" stroke="#9aa5b1" stroke-width="1.5" />
<text x="500.0" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#145a32">microhenry (µH) range</text>
<rect x="646.6666666666666" y="60" width="293.33333333333337" height="70" rx="0" fill="#fdebd0" stroke="#9aa5b1" stroke-width="1.5" />
<text x="793.3333333333333" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#7e5109">millihenry (mH) range</text>
<line x1="60" y1="150" x2="940" y2="150" stroke="#555" stroke-width="3" stroke-linecap="round" />
<line x1="60.0" y1="150" x2="60.0" y2="160" stroke="#444" stroke-width="2.5" stroke-linecap="round" />
<text x="60.0" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1 nH</text>
<line x1="157.77777777777777" y1="150" x2="157.77777777777777" y2="156" stroke="#444" stroke-width="1.8" stroke-linecap="round" />
<text x="157.77777777777777" y="176" text-anchor="middle" font-size="11" font-weight="normal" fill="#666">10 nH</text>
<line x1="255.55555555555554" y1="150" x2="255.55555555555554" y2="156" stroke="#444" stroke-width="1.8" stroke-linecap="round" />
<text x="255.55555555555554" y="176" text-anchor="middle" font-size="11" font-weight="normal" fill="#666">100 nH</text>
<line x1="353.3333333333333" y1="150" x2="353.3333333333333" y2="160" stroke="#444" stroke-width="2.5" stroke-linecap="round" />
<text x="353.3333333333333" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1 µH</text>
<line x1="451.1111111111111" y1="150" x2="451.1111111111111" y2="156" stroke="#444" stroke-width="1.8" stroke-linecap="round" />
<text x="451.1111111111111" y="176" text-anchor="middle" font-size="11" font-weight="normal" fill="#666">10 µH</text>
<line x1="548.8888888888889" y1="150" x2="548.8888888888889" y2="156" stroke="#444" stroke-width="1.8" stroke-linecap="round" />
<text x="548.8888888888889" y="176" text-anchor="middle" font-size="11" font-weight="normal" fill="#666">100 µH</text>
<line x1="646.6666666666666" y1="150" x2="646.6666666666666" y2="160" stroke="#444" stroke-width="2.5" stroke-linecap="round" />
<text x="646.6666666666666" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1 mH</text>
<line x1="744.4444444444445" y1="150" x2="744.4444444444445" y2="156" stroke="#444" stroke-width="1.8" stroke-linecap="round" />
<text x="744.4444444444445" y="176" text-anchor="middle" font-size="11" font-weight="normal" fill="#666">10 mH</text>
<line x1="842.2222222222222" y1="150" x2="842.2222222222222" y2="156" stroke="#444" stroke-width="1.8" stroke-linecap="round" />
<text x="842.2222222222222" y="176" text-anchor="middle" font-size="11" font-weight="normal" fill="#666">100 mH</text>
<line x1="940.0" y1="150" x2="940.0" y2="160" stroke="#444" stroke-width="2.5" stroke-linecap="round" />
<text x="940.0" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">1 H</text>
<circle cx="425.72435186165944" cy="150" r="7" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
<circle cx="512.0510417277948" cy="150" r="7" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
<circle cx="715.0104004239663" cy="150" r="7" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
<text x="417.72435186165944" y="202" text-anchor="end" font-size="12.5" font-weight="bold" fill="#c0392b">5.5 µH</text>
<text x="417.72435186165944" y="218" text-anchor="end" font-size="11.5" font-weight="normal" fill="#c0392b">air-core coil</text>
<text x="520.0510417277948" y="202" text-anchor="start" font-size="12.5" font-weight="bold" fill="#c0392b">42 µH</text>
<text x="520.0510417277948" y="218" text-anchor="start" font-size="11.5" font-weight="normal" fill="#c0392b">with ferrite core</text>
<text x="715.0104004239663" y="202" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#c0392b">5 mH</text>
<text x="715.0104004239663" y="218" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#c0392b">power-filter size</text>
<rect x="30" y="240" width="305" height="170" rx="10" fill="#ffffff" stroke="#1b4f72" stroke-width="2.5" />
<text x="182.5" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b4f72">Nanohenries</text>
<text x="182.5" y="292" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">Filter only very high frequencies</text>
<text x="182.5" y="313" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">(about 100 MHz and above)</text>
<text x="182.5" y="334" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">Radio-frequency (RF) circuits</text>
<text x="182.5" y="355" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">A couple of turns of wire,</text>
<text x="182.5" y="376" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">or a tiny surface-mount part</text>
<rect x="345" y="240" width="305" height="170" rx="10" fill="#ffffff" stroke="#145a32" stroke-width="2.5" />
<text x="497.5" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#145a32">Microhenries</text>
<text x="497.5" y="292" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">Filter roughly 50 kHz to a few MHz</text>
<text x="497.5" y="313" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">and beyond</text>
<text x="497.5" y="334" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">Smoothing in DC power supplies</text>
<text x="497.5" y="355" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">Often shielded so the field</text>
<text x="497.5" y="376" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">does not disturb other parts</text>
<rect x="660" y="240" width="305" height="170" rx="10" fill="#ffffff" stroke="#7e5109" stroke-width="2.5" />
<text x="812.5" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#7e5109">Millihenries</text>
<text x="812.5" y="292" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">A decent amount of inductance</text>
<text x="812.5" y="313" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">Heavy power filters</text>
<text x="812.5" y="334" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">Audio crossovers (splitting low</text>
<text x="812.5" y="355" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">and high sounds)</text>
<text x="812.5" y="376" text-anchor="middle" font-size="13" font-weight="normal" fill="#333">The 5 mH coil used in the demos</text>
<text x="500" y="436" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">1 H = 1,000 mH = 1,000,000 µH = 1,000,000,000 nH</text>
<text x="500" y="457" text-anchor="middle" font-size="12" font-weight="normal" fill="#666">Each tick is 10× the one before (a logarithmic scale).</text>
</svg>