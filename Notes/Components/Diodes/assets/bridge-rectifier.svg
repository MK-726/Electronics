<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 345" width="640" height="345" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <g id="dsym">
      <polygon points="-16,-12 -16,12 16,0" fill="#dddddd" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
      <line x1="16" y1="-12" x2="16" y2="12" stroke="#222" stroke-width="5"/>
    </g>
  </defs>
  <rect width="640" height="345" fill="#ffffff"/>

  <!-- wires -->
  <g stroke="#222" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M320 80 L480 170"/>
    <path d="M320 260 L480 170"/>
    <path d="M160 170 L320 80"/>
    <path d="M160 170 L320 260"/>
    <path d="M320 80 V50"/>
    <path d="M320 260 V292"/>
    <path d="M480 170 H552"/>
    <path d="M160 170 H92"/>
  </g>

  <!-- diodes (D1 Top→Right, D2 Bottom→Right, D3 Left→Top, D4 Left→Bottom) -->
  <use xlink:href="#dsym" transform="translate(400,125) rotate(29.36)"/>
  <use xlink:href="#dsym" transform="translate(400,215) rotate(-29.36)"/>
  <use xlink:href="#dsym" transform="translate(240,125) rotate(-29.36)"/>
  <use xlink:href="#dsym" transform="translate(240,215) rotate(29.36)"/>
  <g font-size="15" font-weight="bold" fill="#222">
    <text x="418" y="101">D1</text>
    <text x="418" y="244">D2</text>
    <text x="222" y="101" text-anchor="end">D3</text>
    <text x="222" y="244" text-anchor="end">D4</text>
  </g>

  <!-- nodes -->
  <g fill="#222"><circle cx="320" cy="80" r="5"/><circle cx="320" cy="260" r="5"/><circle cx="480" cy="170" r="5"/><circle cx="160" cy="170" r="5"/></g>

  <!-- terminals -->
  <g fill="#ffffff" stroke="#222" stroke-width="3">
    <circle cx="320" cy="42" r="8"/>
    <circle cx="320" cy="300" r="8"/>
    <circle cx="560" cy="170" r="8"/>
    <circle cx="84" cy="170" r="8"/>
  </g>
  <text x="340" y="47" font-size="15" font-weight="bold" fill="#222">AC in</text>
  <text x="340" y="305" font-size="15" font-weight="bold" fill="#222">AC in</text>
  <text x="560" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">DC +</text>
  <text x="84" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">DC −</text>

  <text x="320" y="334" text-anchor="middle" font-size="14" fill="#444">Connect the smoothing capacitor and the load across DC + and DC −</text>
</svg>
