<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 400" width="900" height="400" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="redHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <g id="bulbOn">
      <circle r="26" fill="#fff3b0" stroke="#222" stroke-width="3"/>
      <path d="M-14 8 L-7 -8 L0 8 L7 -8 L14 8" stroke="#222" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <g stroke="#f1c40f" stroke-width="3" stroke-linecap="round">
        <line x1="-23" y1="-23" x2="-31" y2="-31"/><line x1="23" y1="-23" x2="31" y2="-31"/>
        <line x1="-23" y1="23" x2="-31" y2="31"/><line x1="23" y1="23" x2="31" y2="31"/>
      </g>
    </g>
    <g id="bulbOff">
      <circle r="26" fill="#eeeeee" stroke="#222" stroke-width="3"/>
      <path d="M-14 8 L-7 -8 L0 8 L7 -8 L14 8" stroke="#999" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <line x1="445" y1="20" x2="445" y2="380" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- FORWARD -->
  <text x="250" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">FORWARD BIAS</text>
  <text x="250" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">Current flows: lamp ON</text>
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 190 V100 H212"/>
    <path d="M250 100 H410 V184"/>
    <path d="M410 236 V320 H90 V225"/>
  </g>
  <line x1="60" y1="190" x2="120" y2="190" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="73" y1="225" x2="107" y2="225" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="132" y="196" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="132" y="236" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="52" y="212" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Cell</text>
  <path d="M212 80 L212 120 L250 100 Z" fill="#dddddd" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <line x1="250" y1="80" x2="250" y2="120" stroke="#222" stroke-width="5"/>
  <text x="195" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Anode</text>
  <text x="278" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">Cathode</text>
  <line x1="300" y1="76" x2="370" y2="76" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="335" y="68" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">I</text>
  <use xlink:href="#bulbOn" x="410" y="210"/>
  <text x="372" y="215" text-anchor="end" font-size="15" font-weight="bold" fill="#222">Lamp</text>
  <text x="250" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Anode to +, cathode to −: diode conducts</text>

  <!-- REVERSE -->
  <text x="680" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">REVERSE BIAS</text>
  <text x="680" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Current blocked: lamp OFF</text>
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M550 190 V100 H672"/>
    <path d="M710 100 H870 V184"/>
    <path d="M870 236 V320 H550 V225"/>
  </g>
  <line x1="520" y1="190" x2="580" y2="190" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="533" y1="225" x2="567" y2="225" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="592" y="196" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="592" y="236" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="512" y="212" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Cell</text>
  <path d="M710 80 L710 120 L672 100 Z" fill="#dddddd" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
  <line x1="672" y1="80" x2="672" y2="120" stroke="#222" stroke-width="5"/>
  <text x="650" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">Cathode</text>
  <text x="732" y="146" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Anode</text>
  <g stroke="#c0392b" stroke-width="5" stroke-linecap="round">
    <line x1="780" y1="88" x2="800" y2="112"/><line x1="800" y1="88" x2="780" y2="112"/>
  </g>
  <text x="790" y="76" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">no current</text>
  <use xlink:href="#bulbOff" x="870" y="210"/>
  <text x="832" y="215" text-anchor="end" font-size="15" font-weight="bold" fill="#222">Lamp</text>
  <text x="680" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Anode to −, cathode to +: diode blocks</text>
</svg>
