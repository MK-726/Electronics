<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="redHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect width="760" height="340" fill="#ffffff"/>
  <line x1="380" y1="20" x2="380" y2="295" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- physical diode -->
  <text x="190" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Physical diode</text>
  <line x1="40" y1="170" x2="340" y2="170" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <rect x="130" y="138" width="130" height="64" rx="8" fill="#2b2b2b"/>
  <rect x="232" y="138" width="16" height="64" fill="#e5e5e5"/>
  <text x="178" y="176" text-anchor="middle" font-size="14" fill="#aaa">1N4001</text>
  <text x="85" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Anode</text>
  <text x="85" y="245" text-anchor="middle" font-size="13" fill="#444">(no stripe)</text>
  <text x="295" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">Cathode</text>
  <text x="295" y="245" text-anchor="middle" font-size="13" fill="#444">(stripe end)</text>
  <text x="240" y="124" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Stripe</text>

  <!-- schematic symbol -->
  <text x="570" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">Schematic symbol</text>
  <g stroke="#222" stroke-width="4" stroke-linecap="round" fill="none">
    <line x1="430" y1="170" x2="520" y2="170"/>
    <line x1="585" y1="170" x2="700" y2="170"/>
    <line x1="585" y1="135" x2="585" y2="205" stroke-width="6"/>
  </g>
  <path d="M520 135 L520 205 L585 170 Z" fill="#dddddd" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <text x="475" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">Anode</text>
  <text x="648" y="152" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">Cathode</text>
  <text x="585" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Bar = stripe</text>
  <line x1="460" y1="236" x2="690" y2="236" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="575" y="262" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Arrow points the way</text>
  <text x="575" y="280" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">conventional current flows</text>

  <text x="380" y="322" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Stripe on the body = bar on the symbol = cathode</text>
</svg>
