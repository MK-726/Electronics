<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 385" width="760" height="385" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="385" fill="#ffffff"/>
  <line x1="380" y1="15" x2="380" y2="350" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- LEFT: forward test -->
  <text x="190" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">1. Forward test</text>
  <text x="190" y="50" text-anchor="middle" font-size="14" fill="#444">Black on the stripe, red on the other end</text>
  <rect x="110" y="62" width="140" height="82" rx="10" fill="#3a3f47"/>
  <rect x="124" y="72" width="112" height="34" rx="4" fill="#cfe8cf" stroke="#888" stroke-width="1.5"/>
  <text x="180" y="97" text-anchor="middle" font-size="22" font-weight="bold" font-family="Courier New, monospace" fill="#1b3a1b">0.516 V</text>
  <text x="180" y="126" text-anchor="middle" font-size="12" fill="#dddddd">diode test mode</text>
  <circle cx="140" cy="146" r="6" fill="#c0392b"/>
  <circle cx="220" cy="146" r="6" fill="#111111"/>
  <path d="M140 152 C140 200 90 200 90 244" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M220 152 C220 200 270 200 270 244" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <circle cx="90" cy="250" r="5" fill="#c0392b"/>
  <circle cx="270" cy="250" r="5" fill="#111111"/>
  <line x1="55" y1="250" x2="305" y2="250" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <rect x="120" y="225" width="120" height="50" rx="7" fill="#2b2b2b"/>
  <rect x="212" y="225" width="14" height="50" fill="#e5e5e5"/>
  <circle cx="90" cy="250" r="5" fill="#c0392b"/>
  <circle cx="270" cy="250" r="5" fill="#111111"/>
  <text x="90" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Anode</text>
  <text x="270" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">Cathode</text>
  <text x="270" y="318" text-anchor="middle" font-size="13" fill="#444">(stripe)</text>
  <text x="190" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">Shows a voltage: diode conducts</text>

  <!-- RIGHT: reverse test -->
  <text x="570" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">2. Reverse test</text>
  <text x="570" y="50" text-anchor="middle" font-size="14" fill="#444">Leads swapped: red on the stripe</text>
  <rect x="490" y="62" width="140" height="82" rx="10" fill="#3a3f47"/>
  <rect x="504" y="72" width="112" height="34" rx="4" fill="#cfe8cf" stroke="#888" stroke-width="1.5"/>
  <text x="560" y="97" text-anchor="middle" font-size="22" font-weight="bold" font-family="Courier New, monospace" fill="#1b3a1b">OL</text>
  <text x="560" y="126" text-anchor="middle" font-size="12" fill="#dddddd">diode test mode</text>
  <circle cx="520" cy="146" r="6" fill="#c0392b"/>
  <circle cx="600" cy="146" r="6" fill="#111111"/>
  <path d="M520 152 C520 200 470 200 470 244" stroke="#c0392b" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M600 152 C600 200 650 200 650 244" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round"/>
  <line x1="435" y1="250" x2="685" y2="250" stroke="#888" stroke-width="5" stroke-linecap="round"/>
  <rect x="500" y="225" width="120" height="50" rx="7" fill="#2b2b2b"/>
  <rect x="514" y="225" width="14" height="50" fill="#e5e5e5"/>
  <circle cx="470" cy="250" r="5" fill="#c0392b"/>
  <circle cx="650" cy="250" r="5" fill="#111111"/>
  <text x="470" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#2471a3">Cathode</text>
  <text x="470" y="318" text-anchor="middle" font-size="13" fill="#444">(stripe)</text>
  <text x="650" y="300" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Anode</text>
  <text x="570" y="342" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e8449">OL (over limit): diode blocks</text>

  <text x="380" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">A reading in BOTH directions means the diode is faulty</text>
</svg>
