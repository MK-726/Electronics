<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="350" fill="#ffffff"/>
<text x="450" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">The groove sets the length and width of the resistive path</text>
<text x="20" y="102" text-anchor="start" font-size="19" font-weight="bold" fill="#222">1 Ω</text>
<line x1="90" y1="95" x2="150" y2="95" stroke="#888" stroke-width="4" stroke-linecap="round" />
<rect x="150" y="67" width="18" height="56" rx="0" fill="#b0b0b0" stroke="#666" stroke-width="1.5" />
<rect x="552" y="67" width="18" height="56" rx="0" fill="#b0b0b0" stroke="#666" stroke-width="1.5" />
<line x1="570" y1="95" x2="600" y2="95" stroke="#888" stroke-width="4" stroke-linecap="round" />
<rect x="168" y="70" width="384" height="50" rx="0" fill="#3d3d3d" stroke="none" stroke-width="2" />
<line x1="351.0" y1="70" x2="369.0" y2="120" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<text x="620" y="93" text-anchor="start" font-size="15" font-weight="bold" fill="#222">About 1 turn</text>
<text x="620" y="113" text-anchor="start" font-size="13" font-weight="normal" fill="#444">Short, wide path: LOW resistance</text>
<text x="20" y="192" text-anchor="start" font-size="19" font-weight="bold" fill="#222">1 kΩ</text>
<line x1="90" y1="185" x2="150" y2="185" stroke="#888" stroke-width="4" stroke-linecap="round" />
<rect x="150" y="157" width="18" height="56" rx="0" fill="#b0b0b0" stroke="#666" stroke-width="1.5" />
<rect x="552" y="157" width="18" height="56" rx="0" fill="#b0b0b0" stroke="#666" stroke-width="1.5" />
<line x1="570" y1="185" x2="600" y2="185" stroke="#888" stroke-width="4" stroke-linecap="round" />
<rect x="168" y="160" width="384" height="50" rx="0" fill="#3d3d3d" stroke="none" stroke-width="2" />
<line x1="255.0" y1="160" x2="273.0" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<line x1="351.0" y1="160" x2="369.0" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<line x1="447.0" y1="160" x2="465.0" y2="210" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<text x="620" y="183" text-anchor="start" font-size="15" font-weight="bold" fill="#222">About 3 turns</text>
<text x="620" y="203" text-anchor="start" font-size="13" font-weight="normal" fill="#444">Longer, narrower path</text>
<text x="20" y="282" text-anchor="start" font-size="19" font-weight="bold" fill="#222">1 MΩ</text>
<line x1="90" y1="275" x2="150" y2="275" stroke="#888" stroke-width="4" stroke-linecap="round" />
<rect x="150" y="247" width="18" height="56" rx="0" fill="#b0b0b0" stroke="#666" stroke-width="1.5" />
<rect x="552" y="247" width="18" height="56" rx="0" fill="#b0b0b0" stroke="#666" stroke-width="1.5" />
<line x1="570" y1="275" x2="600" y2="275" stroke="#888" stroke-width="4" stroke-linecap="round" />
<rect x="168" y="250" width="384" height="50" rx="0" fill="#3d3d3d" stroke="none" stroke-width="2" />
<line x1="223.0" y1="250" x2="241.0" y2="300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<line x1="287.0" y1="250" x2="305.0" y2="300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<line x1="351.0" y1="250" x2="369.0" y2="300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<line x1="415.0" y1="250" x2="433.0" y2="300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<line x1="479.0" y1="250" x2="497.0" y2="300" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
<text x="620" y="273" text-anchor="start" font-size="15" font-weight="bold" fill="#222">About 5 turns</text>
<text x="620" y="293" text-anchor="start" font-size="13" font-weight="normal" fill="#444">Long, very thin path: HIGH resistance</text>
<text x="450" y="335" text-anchor="middle" font-size="14" font-weight="normal" fill="#555">Same film and core each time. Only the groove pitch changes the path.</text>
