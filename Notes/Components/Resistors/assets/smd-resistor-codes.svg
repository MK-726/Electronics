<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="900" height="610" fill="#ffffff"/>
<line x1="300" y1="15" x2="300" y2="595" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<line x1="600" y1="15" x2="600" y2="595" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<line x1="15" y1="200" x2="885" y2="200" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<line x1="15" y1="400" x2="885" y2="400" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" />
<text x="150" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">3-digit code</text>
<rect x="90" y="52" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="90" y="52" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="196" y="52" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="150" y="89" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">240</text>
<text x="150" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">24 × 1 = 24 Ω</text>
<text x="150" y="162" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">third digit = number of zeros (0)</text>
<text x="450" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">3-digit code</text>
<rect x="390" y="52" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="390" y="52" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="496" y="52" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="450" y="89" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">101</text>
<text x="450" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">10 × 10 = 100 Ω</text>
<text x="450" y="162" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">third digit = number of zeros (1)</text>
<text x="750" y="30" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">3-digit code</text>
<rect x="690" y="52" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="690" y="52" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="796" y="52" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="750" y="89" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">183</text>
<text x="750" y="140" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">18 × 1,000 = 18 kΩ</text>
<text x="750" y="162" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">third digit = number of zeros (3)</text>
<text x="150" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">4-digit code</text>
<rect x="90" y="252" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="90" y="252" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="196" y="252" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="150" y="289" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">1000</text>
<text x="150" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">100 × 1 = 100 Ω</text>
<text x="150" y="362" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">last digit = number of zeros (0)</text>
<text x="450" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">4-digit code</text>
<rect x="390" y="252" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="390" y="252" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="496" y="252" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="450" y="289" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">3502</text>
<text x="450" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">350 × 100 = 35 kΩ</text>
<text x="450" y="362" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">last digit = number of zeros (2)</text>
<text x="750" y="230" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">R = decimal point</text>
<rect x="690" y="252" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="690" y="252" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="796" y="252" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="750" y="289" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">R56</text>
<text x="750" y="340" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">0.56 Ω</text>
<text x="750" y="362" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">R stands in for the decimal point</text>
<text x="150" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">R = decimal point</text>
<rect x="90" y="452" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="90" y="452" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="196" y="452" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="150" y="489" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">47R5</text>
<text x="150" y="540" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">47.5 Ω</text>
<text x="150" y="562" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">R stands in for the decimal point</text>
<text x="450" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">EIA-96 (2 digits + letter)</text>
<rect x="390" y="452" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="390" y="452" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="496" y="452" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="450" y="489" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">26C</text>
<text x="450" y="540" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">26 → 182, C = ×100</text>
<text x="450" y="562" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">= 18,200 Ω (18.2 kΩ)</text>
<text x="750" y="430" text-anchor="middle" font-size="14" font-weight="bold" fill="#2471a3">EIA-96 (2 digits + letter)</text>
<rect x="690" y="452" width="120" height="54" rx="3" fill="#2b2b2b" stroke="none" stroke-width="0" />
<rect x="690" y="452" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<rect x="796" y="452" width="14" height="54" rx="0" fill="#c0c0c0" stroke="none" stroke-width="2" />
<text x="750" y="489" text-anchor="middle" font-size="25" font-weight="bold" font-family="Courier New, monospace" fill="#ffffff">60Z</text>
<text x="750" y="540" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">60 → 412, Z = ×0.001</text>
<text x="750" y="562" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">= 0.412 Ω</text>
</svg>