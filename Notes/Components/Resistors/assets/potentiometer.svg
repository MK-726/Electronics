<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5.0" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5.0 L0 10 z" fill="#222"/></marker></defs>
<rect width="960" height="390" fill="#ffffff"/>
<line x1="320" y1="15" x2="320" y2="375" stroke="#e1e1e1" stroke-width="2" stroke-linecap="round" />
<line x1="640" y1="15" x2="640" y2="375" stroke="#e1e1e1" stroke-width="2" stroke-linecap="round" />
<text x="160" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Inside a potentiometer</text>
<rect x="50" y="110" width="220" height="22" rx="4" fill="#5a5a5a" stroke="none" stroke-width="0" />
<text x="160" y="126" text-anchor="middle" font-size="12" font-weight="normal" fill="#ffffff">resistive track</text>
<line x1="62" y1="132" x2="62" y2="178" stroke="#888" stroke-width="5" stroke-linecap="round" />
<line x1="258" y1="132" x2="258" y2="178" stroke="#888" stroke-width="5" stroke-linecap="round" />
<line x1="160" y1="40" x2="160" y2="72" stroke="#888" stroke-width="5" stroke-linecap="round" />
<line x1="160" y1="72" x2="205" y2="108" stroke="#c0392b" stroke-width="4" stroke-linecap="round" />
<circle cx="205" cy="108" r="5" fill="#c0392b" stroke="none" stroke-width="2"/>
<text x="176" y="56" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">pin 2 (wiper)</text>
<text x="62" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pin 1</text>
<text x="258" y="198" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">pin 3</text>
<line x1="110" y1="88" x2="80" y2="88" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ah)"/><line x1="215" y1="88" x2="245" y2="88" stroke="#c0392b" stroke-width="2.5" marker-end="url(#ah)"/>
<line x1="62" y1="226" x2="205" y2="226" stroke="#222" stroke-width="2" stroke-linecap="round" />
<line x1="62" y1="220" x2="62" y2="232" stroke="#222" stroke-width="2" stroke-linecap="round" />
<line x1="205" y1="220" x2="205" y2="232" stroke="#222" stroke-width="2" stroke-linecap="round" />
<text x="133" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R(1–2)</text>
<line x1="205" y1="226" x2="258" y2="226" stroke="#222" stroke-width="2" stroke-linecap="round" />
<line x1="205" y1="220" x2="205" y2="232" stroke="#222" stroke-width="2" stroke-linecap="round" />
<line x1="258" y1="220" x2="258" y2="232" stroke="#222" stroke-width="2" stroke-linecap="round" />
<text x="231" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">R(2–3)</text>
<text x="160" y="285" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Dial moves the wiper along the track.</text>
<text x="160" y="304" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Further from pin 1: R(1–2) grows,</text>
<text x="160" y="323" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">and R(2–3) shrinks.</text>
<text x="480" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Voltage divider use</text>
<text x="480" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">+Vin</text>
<line x1="480" y1="70" x2="480" y2="110" stroke="#222" stroke-width="4" stroke-linecap="round" />
<rect x="465" y="110" width="30" height="90" rx="0" fill="#ffffff" stroke="#222" stroke-width="4" />
<line x1="480" y1="200" x2="480" y2="240" stroke="#222" stroke-width="4" stroke-linecap="round" />
<line x1="462" y1="242" x2="498" y2="242" stroke="#222" stroke-width="3" stroke-linecap="round" />
<line x1="468" y1="249" x2="492" y2="249" stroke="#222" stroke-width="3" stroke-linecap="round" />
<line x1="474" y1="256" x2="486" y2="256" stroke="#222" stroke-width="3" stroke-linecap="round" />
<line x1="545" y1="155" x2="497" y2="155" stroke="#222" stroke-width="3" marker-end="url(#ah)"/>
<line x1="545" y1="155" x2="600" y2="155" stroke="#222" stroke-width="4" stroke-linecap="round" />
<text x="606" y="160" text-anchor="start" font-size="15" font-weight="bold" fill="#2471a3">Vout</text>
<text x="504" y="106" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">1</text>
<text x="504" y="214" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">3</text>
<text x="548" y="144" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">2</text>
<text x="480" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">All 3 pins used:</text>
<text x="480" y="309" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Vout is a fraction of Vin,</text>
<text x="480" y="328" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">set by the dial position.</text>
<text x="800" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Rheostat use</text>
<text x="800" y="62" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">In</text>
<line x1="800" y1="70" x2="800" y2="110" stroke="#222" stroke-width="4" stroke-linecap="round" />
<rect x="785" y="110" width="30" height="90" rx="0" fill="#ffffff" stroke="#222" stroke-width="4" />
<line x1="800" y1="200" x2="800" y2="236" stroke="#222" stroke-width="4" stroke-linecap="round" />
<circle cx="800" cy="242" r="5" fill="#ffffff" stroke="#222" stroke-width="2"/>
<text x="800" y="266" text-anchor="middle" font-size="12" font-weight="normal" fill="#555" font-style="italic">pin 3 unused</text>
<line x1="865" y1="155" x2="817" y2="155" stroke="#222" stroke-width="3" marker-end="url(#ah)"/>
<line x1="865" y1="155" x2="905" y2="155" stroke="#222" stroke-width="4" stroke-linecap="round" />
<text x="911" y="160" text-anchor="start" font-size="15" font-weight="bold" fill="#222">Out</text>
<text x="800" y="290" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">2 pins used (1 + wiper):</text>
<text x="800" y="309" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">a variable resistance in series</text>
<text x="800" y="328" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">with the load, to control current.</text>
</svg>