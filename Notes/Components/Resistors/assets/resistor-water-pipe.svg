<text x="400" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Partial blockage = resistor</text>
<text x="400" y="292" text-anchor="middle" font-size="14" font-weight="normal" fill="#444">Water collides with the restriction, so it flows less easily and the pressure drops.</text>
<text x="400" y="314" text-anchor="middle" font-size="14" font-weight="normal" fill="#444">Electrons collide in a resistor: current is limited, voltage drops, and the energy becomes heat.</text>
