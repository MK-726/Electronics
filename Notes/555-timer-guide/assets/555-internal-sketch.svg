<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1160" viewBox="0 0 1500 1160" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Simplified internal block diagram of a 555 timer IC</title>
  <desc id="desc">White-background educational diagram of the 555 timer: a three-resistor divider, threshold and trigger comparators, an SR latch, an inverting output driver, an NPN discharge transistor, and the eight external pins. Numbered badges on each block match the plain-language notes below the chip.</desc>
  <defs>
    <style>
      .bg{fill:#fff}
      .title{font:700 30px Arial,sans-serif;fill:#172033}
      .subtitle{font:16px Arial,sans-serif;fill:#536174}
      .chip{fill:#f8fafc;stroke:#334155;stroke-width:3}
      .block{fill:#fff;stroke:#475569;stroke-width:2.4;stroke-linejoin:round}
      .pin{stroke:#334155;stroke-width:3;fill:none}
      .wire{stroke:#64748b;stroke-width:2.4;fill:none;stroke-linejoin:round}
      .dot{fill:#334155}
      .comp{font:700 17px Arial,sans-serif;fill:#172033;text-anchor:middle}
      .small{font:14px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .ref{font:700 13px Arial,sans-serif;fill:#1d4ed8}
      .sym{font:700 16px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .pintext{font:700 15px Arial,sans-serif;fill:#172033}
      .note{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}
      .notehead{font:700 17px Arial,sans-serif;fill:#1d4ed8}
      .notetext{font:15px Arial,sans-serif;fill:#243247}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}
      .numtext{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:central}
      .foot{font:13px Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="bg" width="1500" height="1160"/>
  <text x="60" y="55" class="title">Inside the 555 timer</text>
  <text x="60" y="84" class="subtitle">Simplified functional sketch • standard 8-pin package • not a transistor-level schematic</text>

  <!-- Chip body -->
  <rect x="300" y="170" width="900" height="560" rx="18" class="chip"/>
  <text x="620" y="205" class="comp" style="font-size:22px">555 TIMER IC</text>

  <!-- External pins -->
  <path class="pin" d="M380 140 V170 M500 140 V170 M810 140 V170
                       M230 315 H300
                       M1200 330 H1270 M1200 540 H1270
                       M380 730 V770 M500 730 V770"/>
  <text x="380" y="128" class="pintext" text-anchor="middle">8 · VCC</text>
  <text x="500" y="128" class="pintext" text-anchor="middle">6 · THRESHOLD</text>
  <text x="810" y="128" class="pintext" text-anchor="middle">4 · RESET</text>
  <text x="220" y="321" class="pintext" text-anchor="end">5 · CONTROL</text>
  <text x="1282" y="336" class="pintext">3 · OUTPUT</text>
  <text x="1282" y="546" class="pintext">7 · DISCHARGE</text>
  <text x="380" y="794" class="pintext" text-anchor="middle">1 · GND</text>
  <text x="500" y="794" class="pintext" text-anchor="middle">2 · TRIGGER</text>

  <!-- Resistor divider: VCC - R - (2/3 VCC) - R - (1/3 VCC) - R - GND -->
  <path class="wire" d="M380 170 V215 M380 285 V345 M380 415 V475 M380 545 V730"/>
  <rect x="368" y="215" width="24" height="70" rx="3" class="block"/>
  <rect x="368" y="345" width="24" height="70" rx="3" class="block"/>
  <rect x="368" y="475" width="24" height="70" rx="3" class="block"/>
  <text x="380" y="255" class="small" style="font-size:13px;font-weight:700">R</text>
  <text x="380" y="385" class="small" style="font-size:13px;font-weight:700">R</text>
  <text x="380" y="515" class="small" style="font-size:13px;font-weight:700">R</text>
  <text x="408" y="372" class="comp" style="text-anchor:start">Resistor divider</text>
  <text x="408" y="392" class="small" style="text-anchor:start">3 equal resistors</text>

  <!-- Tap A (2/3 VCC) shared with CONTROL pin; tap B (1/3 VCC) -->
  <path class="wire" d="M300 315 H560"/>
  <circle cx="380" cy="315" r="5" class="dot"/>
  <text x="402" y="307" class="ref">2/3 VCC</text>
  <path class="wire" d="M380 445 H560"/>
  <circle cx="380" cy="445" r="5" class="dot"/>
  <text x="402" y="437" class="ref">1/3 VCC</text>

  <!-- Threshold comparator: + = THRESHOLD pin, − = 2/3 VCC -->
  <path class="wire" d="M500 170 V275 H560"/>
  <path class="block" d="M560 255 L560 335 L680 295 Z"/>
  <text x="574" y="280" class="sym">+</text>
  <text x="574" y="321" class="sym">−</text>
  <text x="620" y="372" class="comp">Threshold</text>
  <text x="620" y="391" class="small">comparator</text>

  <!-- Trigger comparator: + = 1/3 VCC, − = TRIGGER pin -->
  <path class="wire" d="M500 730 V485 H560"/>
  <path class="block" d="M560 425 L560 505 L680 465 Z"/>
  <text x="574" y="450" class="sym">+</text>
  <text x="574" y="491" class="sym">−</text>
  <text x="620" y="532" class="comp">Trigger</text>
  <text x="620" y="551" class="small">comparator</text>

  <!-- Comparator outputs to the latch -->
  <path class="wire" d="M680 295 H700 V425 H740"/>
  <path class="wire" d="M680 465 H715 V495 H740"/>

  <!-- SR latch -->
  <rect x="740" y="395" width="140" height="130" rx="10" class="block"/>
  <text x="752" y="430" class="small" style="text-anchor:start;font-weight:700">R</text>
  <text x="752" y="500" class="small" style="text-anchor:start;font-weight:700">S</text>
  <text x="820" y="453" class="comp">SR latch</text>
  <text x="820" y="473" class="small">Stores the state</text>
  <!-- Active-low RESET input with bubble -->
  <path class="wire" d="M810 170 V384"/>
  <circle cx="810" cy="389" r="5" class="block" style="stroke-width:2"/>
  <text x="810" y="416" class="small" style="font-size:11px">RESET</text>

  <!-- Latch output (Q-bar) -->
  <path class="wire" d="M880 460 H930 M930 330 V610 H995"/>
  <circle cx="930" cy="460" r="5" class="dot"/>
  <text x="888" y="453" class="small" style="text-anchor:start;font-weight:700">Q</text>
  <path d="M888 441 H898" stroke="#475569" stroke-width="1.6"/>

  <!-- Output driver (inverting buffer) -->
  <path class="wire" d="M930 330 H960"/>
  <path class="block" d="M960 300 L960 360 L1030 330 Z"/>
  <circle cx="1036" cy="330" r="6" class="block" style="stroke-width:2"/>
  <path class="wire" d="M1042 330 H1200"/>
  <text x="1030" y="392" class="comp">Output driver</text>
  <text x="1030" y="411" class="small">pushes / pulls</text>

  <!-- Discharge transistor (NPN) -->
  <circle cx="1010" cy="610" r="36" class="block"/>
  <path class="wire" d="M995 592 V628"/>
  <path class="wire" d="M995 602 L1025 580 V540 H1200"/>
  <path class="wire" d="M995 618 L1025 640 V680"/>
  <polygon points="1021,637 1010.2,634.7 1015.6,627.5" fill="#64748b"/>
  <path class="wire" d="M1013 690 H1037 M1017 697 H1033 M1021 704 H1029" style="stroke-width:2"/>
  <path class="wire" d="M1025 680 V690"/>
  <text x="1120" y="604" class="comp">Discharge</text>
  <text x="1120" y="624" class="small">transistor</text>
  <text x="1046" y="702" class="foot" style="font-size:12px">to pin 1</text>

  <!-- Numbered badges -->
  <circle cx="336" cy="250" r="13" class="num"/><text x="336" y="250" class="numtext">1</text>
  <circle cx="598" cy="247" r="13" class="num"/><text x="598" y="247" class="numtext">2</text>
  <circle cx="592" cy="415" r="13" class="num"/><text x="592" y="415" class="numtext">2</text>
  <circle cx="740" cy="395" r="13" class="num"/><text x="740" y="395" class="numtext">3</text>
  <circle cx="972" cy="285" r="13" class="num"/><text x="972" y="285" class="numtext">4</text>
  <circle cx="955" cy="572" r="13" class="num"/><text x="955" y="572" class="numtext">5</text>
  <circle cx="838" cy="232" r="13" class="num"/><text x="838" y="232" class="numtext">6</text>

  <!-- Notes (3 x 2 grid) -->
  <rect x="60" y="830" width="440" height="118" rx="12" class="note"/>
  <circle cx="85" cy="857" r="15" class="num"/><text x="85" y="857" class="numtext">1</text>
  <text x="110" y="863" class="notehead">Resistor divider</text>
  <text x="80" y="892" class="notetext">Makes two reference levels: about 1/3 and 2/3 of</text>
  <text x="80" y="914" class="notetext">VCC. These are the timer's checkpoints. Pin 5 taps</text>
  <text x="80" y="936" class="notetext">the 2/3 level, so a voltage there can shift it.</text>

  <rect x="530" y="830" width="440" height="118" rx="12" class="note"/>
  <circle cx="555" cy="857" r="15" class="num"/><text x="555" y="857" class="numtext">2</text>
  <text x="580" y="863" class="notehead">Comparators</text>
  <text x="550" y="892" class="notetext">Compare pins 6 and 2 with the reference levels.</text>
  <text x="550" y="914" class="notetext">Each output goes HIGH when its input crosses its</text>
  <text x="550" y="936" class="notetext">level, telling the latch to change state.</text>

  <rect x="1000" y="830" width="440" height="118" rx="12" class="note"/>
  <circle cx="1025" cy="857" r="15" class="num"/><text x="1025" y="857" class="numtext">3</text>
  <text x="1050" y="863" class="notehead">SR latch</text>
  <text x="1020" y="892" class="notetext">A tiny memory: the trigger comparator sets it, the</text>
  <text x="1020" y="914" class="notetext">threshold comparator resets it. It remembers if the</text>
  <text x="1020" y="936" class="notetext">output should be HIGH or LOW between checks.</text>

  <rect x="60" y="964" width="440" height="118" rx="12" class="note"/>
  <circle cx="85" cy="991" r="15" class="num"/><text x="85" y="991" class="numtext">4</text>
  <text x="110" y="997" class="notehead">Output driver</text>
  <text x="80" y="1026" class="notetext">Provides the OUT signal (pin 3) to control a load</text>
  <text x="80" y="1048" class="notetext">or signal the next part of a circuit. It can both</text>
  <text x="80" y="1070" class="notetext">source and sink current (push and pull).</text>

  <rect x="530" y="964" width="440" height="118" rx="12" class="note"/>
  <circle cx="555" cy="991" r="15" class="num"/><text x="555" y="991" class="numtext">5</text>
  <text x="580" y="997" class="notehead">Discharge transistor</text>
  <text x="550" y="1026" class="notetext">Acts like an electronic drain. When switched on, it</text>
  <text x="550" y="1048" class="notetext">pulls pin 7 toward ground to discharge the external</text>
  <text x="550" y="1070" class="notetext">timing capacitor. It is on whenever OUT is LOW.</text>

  <rect x="1000" y="964" width="440" height="118" rx="12" class="note"/>
  <circle cx="1025" cy="991" r="15" class="num"/><text x="1025" y="991" class="numtext">6</text>
  <text x="1050" y="997" class="notehead">RESET (pin 4)</text>
  <text x="1020" y="1026" class="notetext">An active-LOW override input. Pulling it LOW forces</text>
  <text x="1020" y="1048" class="notetext">the output LOW, regardless of timing. Tie it to VCC</text>
  <text x="1020" y="1070" class="notetext">when you do not need it.</text>

  <text x="60" y="1108" class="foot">Pin numbers shown are for the common 8-pin NE555-style package. Exact internal transistor-level designs vary by manufacturer. Ground symbols inside the chip all connect to pin 1.</text>
  <text x="60" y="1128" class="foot">Conceptual diagram based on the functional architecture described in the Texas Instruments 555 timer datasheet.</text>
  <text x="60" y="1148" class="foot">Learning note: timing resistors and capacitors are usually external to the IC; they are not shown as internal components here.</text>
</svg>
