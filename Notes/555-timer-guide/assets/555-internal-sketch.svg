<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" role="img" aria-labelledby="title desc">
  <title id="title">Simplified internal block diagram of a 555 timer IC</title>
  <desc id="desc">White-background educational diagram of the 555 timer's resistor divider, two comparators, SR latch, output driver, discharge transistor, and eight external pins. Numbered arrows connect internal blocks to plain-language notes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <style>
      .bg{fill:#fff}
      .title{font:700 30px Arial,sans-serif;fill:#172033}
      .subtitle{font:16px Arial,sans-serif;fill:#536174}
      .chip{fill:#f8fafc;stroke:#334155;stroke-width:3}
      .block{fill:#fff;stroke:#475569;stroke-width:2.4}
      .pin{stroke:#334155;stroke-width:3;fill:none}
      .wire{stroke:#64748b;stroke-width:2.4;fill:none}
      .signal{stroke:#2563eb;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .comp{font:700 17px Arial,sans-serif;fill:#172033;text-anchor:middle}
      .small{font:14px Arial,sans-serif;fill:#475569;text-anchor:middle}
      .pintext{font:700 15px Arial,sans-serif;fill:#172033}
      .note{fill:#eff6ff;stroke:#93c5fd;stroke-width:1.5}
      .notehead{font:700 17px Arial,sans-serif;fill:#1d4ed8}
      .notetext{font:15px Arial,sans-serif;fill:#243247}
      .num{fill:#2563eb;stroke:#fff;stroke-width:2}
      .numtext{font:700 14px Arial,sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .foot{font:13px Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect class="bg" width="1500" height="1050"/>
  <text x="60" y="55" class="title">Inside the 555 timer</text>
  <text x="60" y="84" class="subtitle">Simplified functional sketch • standard 8-pin package • not a transistor-level schematic</text>

  <!-- Main IC body -->
  <rect x="370" y="125" width="600" height="770" rx="18" class="chip"/>
  <text x="670" y="160" class="comp" style="font-size:22px">555 TIMER IC</text>

  <!-- Pins left -->
  <path class="pin" d="M285 220 H370 M285 320 H370 M285 420 H370 M285 520 H370"/>
  <text x="270" y="214" class="pintext" text-anchor="end">8 · VCC</text>
  <text x="270" y="314" class="pintext" text-anchor="end">6 · THRESHOLD</text>
  <text x="270" y="414" class="pintext" text-anchor="end">2 · TRIGGER</text>
  <text x="270" y="514" class="pintext" text-anchor="end">5 · CONTROL</text>
  <!-- Pins right -->
  <path class="pin" d="M970 245 H1055 M970 405 H1055 M970 565 H1055 M970 725 H1055"/>
  <text x="1070" y="239" class="pintext">4 · RESET</text>
  <text x="1070" y="399" class="pintext">3 · OUTPUT</text>
  <text x="1070" y="559" class="pintext">7 · DISCHARGE</text>
  <text x="1070" y="719" class="pintext">1 · GND</text>

  <!-- Divider -->
  <rect x="430" y="185" width="190" height="260" rx="10" class="block"/>
  <text x="525" y="213" class="comp">Resistor divider</text>
  <text x="525" y="235" class="small">3 equal resistors</text>
  <path class="wire" d="M525 255 V275 M500 275 H550 M500 275 V300 M550 275 V300 M500 300 H550"/>
  <rect x="488" y="300" width="74" height="34" rx="4" class="block"/>
  <text x="525" y="322" class="small">R</text>
  <path class="wire" d="M525 334 V350"/>
  <circle cx="525" cy="350" r="5" fill="#2563eb"/>
  <path class="wire" d="M500 365 H550 M500 365 V390 M550 365 V390 M500 390 H550"/>
  <rect x="488" y="390" width="74" height="34" rx="4" class="block"/>
  <text x="525" y="412" class="small">R</text>
  <text x="525" y="440" class="small">Creates reference levels</text>
  <path class="wire" d="M370 220 H410 V255 H430"/>
  <path class="wire" d="M525 255 V245"/>
  <path class="wire" d="M525 424 V435 H410 V720 H370"/>
  <text x="420" y="705" class="small" transform="rotate(-90 420 705)">to ground reference</text>

  <!-- Comparators -->
  <path class="block" d="M680 250 L680 320 L750 285 Z"/>
  <text x="704" y="282" class="small">+</text>
  <text x="704" y="305" class="small">−</text>
  <text x="715" y="340" class="comp">Threshold</text>
  <text x="715" y="359" class="small">comparator</text>
  <path class="wire" d="M620 285 H680"/>
  <path class="wire" d="M620 320 H650 V305 H680"/>
  <path class="wire" d="M750 285 H790 V365 H810"/>
  <path class="wire" d="M370 320 H395 V285 H430"/>
  <path class="wire" d="M370 520 H400 V350 H430"/>
  <path class="wire" d="M525 350 H650 V320"/>
  <text x="615" y="270" class="small">2/3 VCC</text>

  <path class="block" d="M680 405 L680 475 L750 440 Z"/>
  <text x="704" y="437" class="small">+</text>
  <text x="704" y="460" class="small">−</text>
  <text x="715" y="495" class="comp">Trigger</text>
  <text x="715" y="514" class="small">comparator</text>
  <path class="wire" d="M620 430 H680"/>
  <path class="wire" d="M620 465 H650 V460 H680"/>
  <path class="wire" d="M750 440 H790 V455 H810"/>
  <path class="wire" d="M370 420 H395 V445 H430"/>
  <path class="wire" d="M525 350 H640 V465 H680"/>
  <text x="615" y="416" class="small">1/3 VCC</text>

  <!-- Latch -->
  <rect x="810" y="365" width="120" height="135" rx="10" class="block"/>
  <text x="870" y="395" class="comp">SR latch</text>
  <text x="870" y="423" class="small">Stores</text>
  <text x="870" y="442" class="small">the state</text>
  <text x="870" y="470" class="small">SET / RESET</text>
  <path class="wire" d="M930 430 H950 V405 H970"/>
  <path class="wire" d="M970 245 H945 V365 H900 V365"/>
  <text x="922" y="350" class="small">RESET</text>

  <!-- Output driver and discharge transistor -->
  <rect x="790" y="590" width="150" height="80" rx="10" class="block"/>
  <text x="865" y="620" class="comp">Output driver</text>
  <text x="865" y="642" class="small">pushes / pulls</text>
  <path class="wire" d="M870 500 V555 H865 V590"/>
  <path class="wire" d="M940 630 H990 V405 H970"/>
  <rect x="790" y="700" width="150" height="80" rx="10" class="block"/>
  <text x="865" y="730" class="comp">Discharge</text>
  <text x="865" y="751" class="small">transistor</text>
  <path class="wire" d="M900 500 H950 V740 H940"/>
  <path class="wire" d="M940 740 H990 V565 H970"/>
  <path class="wire" d="M865 780 V810 H525 V720"/>
  <text x="610" y="802" class="small">switches timing capacitor toward GND</text>

  <!-- External note cards -->
  <rect x="55" y="585" width="275" height="125" rx="12" class="note"/>
  <circle cx="80" cy="610" r="15" class="num"/><text x="80" y="610" class="numtext">1</text>
  <text x="105" y="615" class="notehead">Resistor divider</text>
  <text x="75" y="643" class="notetext">Makes two reference levels:</text>
  <text x="75" y="665" class="notetext">about 1/3 and 2/3 of VCC.</text>
  <text x="75" y="687" class="notetext">These are the timer's checkpoints.</text>
  <path class="signal" d="M330 630 H350 V185 H430"/>

  <rect x="55" y="735" width="275" height="125" rx="12" class="note"/>
  <circle cx="80" cy="760" r="15" class="num"/><text x="80" y="760" class="numtext">2</text>
  <text x="105" y="765" class="notehead">Comparators</text>
  <text x="75" y="793" class="notetext">Compare input voltages with</text>
  <text x="75" y="815" class="notetext">the reference levels, then tell</text>
  <text x="75" y="837" class="notetext">the latch when to change state.</text>
  <path class="signal" d="M330 790 H350 V545 H715 V514"/>

  <rect x="1120" y="115" width="325" height="130" rx="12" class="note"/>
  <circle cx="1145" cy="140" r="15" class="num"/><text x="1145" y="140" class="numtext">3</text>
  <text x="1170" y="145" class="notehead">SR latch</text>
  <text x="1140" y="173" class="notetext">A tiny memory: it remembers</text>
  <text x="1140" y="195" class="notetext">whether the output should be</text>
  <text x="1140" y="217" class="notetext">HIGH or LOW between checks.</text>
  <path class="signal" d="M1120 205 H1095 V350 H870 V365"/>

  <rect x="1120" y="285" width="325" height="130" rx="12" class="note"/>
  <circle cx="1145" cy="310" r="15" class="num"/><text x="1145" y="310" class="numtext">4</text>
  <text x="1170" y="315" class="notehead">Output driver</text>
  <text x="1140" y="343" class="notetext">Provides the OUT signal (pin 3)</text>
  <text x="1140" y="365" class="notetext">to control a load or signal the</text>
  <text x="1140" y="387" class="notetext">next part of a circuit.</text>
  <path class="signal" d="M1120 355 H1085 V630 H940"/>

  <rect x="1120" y="455" width="325" height="145" rx="12" class="note"/>
  <circle cx="1145" cy="480" r="15" class="num"/><text x="1145" y="480" class="numtext">5</text>
  <text x="1170" y="485" class="notehead">Discharge transistor</text>
  <text x="1140" y="513" class="notetext">Acts like an electronic drain.</text>
  <text x="1140" y="535" class="notetext">When switched on, it pulls pin 7</text>
  <text x="1140" y="557" class="notetext">toward ground to discharge the</text>
  <text x="1140" y="579" class="notetext">external timing capacitor.</text>
  <path class="signal" d="M1120 530 H1080 V740 H940"/>

  <rect x="1120" y="640" width="325" height="135" rx="12" class="note"/>
  <circle cx="1145" cy="665" r="15" class="num"/><text x="1145" y="665" class="numtext">6</text>
  <text x="1170" y="670" class="notehead">RESET (pin 4)</text>
  <text x="1140" y="698" class="notetext">An active-LOW override input.</text>
  <text x="1140" y="720" class="notetext">Pulling it LOW forces the timer</text>
  <text x="1140" y="742" class="notetext">output LOW, regardless of timing.</text>
  <path class="signal" d="M1120 705 H1095 V245 H970"/>

  <text x="60" y="935" class="foot">Pin numbers shown are for the common 8-pin NE555-style package. Exact internal transistor-level designs vary by manufacturer.</text>
  <text x="60" y="958" class="foot">Conceptual diagram based on the functional architecture described in the Texas Instruments 555 timer datasheet.</text>
  <text x="60" y="1000" class="foot">Learning note: timing resistors and capacitors are usually external to the IC; they are not shown as internal components here.</text>
</svg>