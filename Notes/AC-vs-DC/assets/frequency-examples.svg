<text x="450" y="316" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Mains electricity: 60 Hz (North America) or 50 Hz (most of the world) = 60 or 50 of these cycles every second.</text>
<text x="450" y="339" text-anchor="middle" font-size="14" font-weight="normal" fill="#444">Each cycle reverses the polarity twice, so 60 Hz means 120 reversals per second.</text>
<text x="450" y="361" text-anchor="middle" font-size="14" font-weight="normal" fill="#444">Period = 1 ÷ frequency:  60 Hz → 16.7 ms   ·   50 Hz → 20 ms</text>
