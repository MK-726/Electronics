<text x="500" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">How AC electricity reaches your home (typical voltage levels)</text>
<line x1="90" y1="372" x2="910" y2="372" stroke="#1e8449" stroke-width="5" marker-end="url(#gh)"/>
<text x="500" y="402" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e8449">Higher voltage → lower current → less heat lost in the wires (loss = I² × R)</text>
<text x="500" y="430" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">Transformers only work with AC, which is why the grid is built on it. Voltage ranges vary by country and utility.</text>
