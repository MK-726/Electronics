<text x="910" y="200" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Your home</text>
<text x="910" y="244" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">120 V (N. America)</text>
<text x="910" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">230 V (most of world)</text>
