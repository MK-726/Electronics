<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs></defs>
<rect width="820" height="380" fill="#ffffff"/>
<text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Sending 100 W through a line with 1 Ω of resistance</text>
<line x1="230.0" y1="55" x2="230.0" y2="290" stroke="#e3e3e3" stroke-width="2" stroke-linecap="round" />
<line x1="362.5" y1="55" x2="362.5" y2="290" stroke="#e3e3e3" stroke-width="2" stroke-linecap="round" />
<line x1="495.0" y1="55" x2="495.0" y2="290" stroke="#e3e3e3" stroke-width="2" stroke-linecap="round" />
<line x1="627.5" y1="55" x2="627.5" y2="290" stroke="#e3e3e3" stroke-width="2" stroke-linecap="round" />
<line x1="760.0" y1="55" x2="760.0" y2="290" stroke="#e3e3e3" stroke-width="2" stroke-linecap="round" />
<line x1="230" y1="290" x2="760" y2="290" stroke="#555" stroke-width="2" stroke-linecap="round" />
<line x1="230.0" y1="290" x2="230.0" y2="297" stroke="#555" stroke-width="2" stroke-linecap="round" />
<text x="230.0" y="314" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">0.01</text>
<line x1="362.5" y1="290" x2="362.5" y2="297" stroke="#555" stroke-width="2" stroke-linecap="round" />
<text x="362.5" y="314" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">0.1</text>
<line x1="495.0" y1="290" x2="495.0" y2="297" stroke="#555" stroke-width="2" stroke-linecap="round" />
<text x="495.0" y="314" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">1</text>
<line x1="627.5" y1="290" x2="627.5" y2="297" stroke="#555" stroke-width="2" stroke-linecap="round" />
<text x="627.5" y="314" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">10</text>
<line x1="760.0" y1="290" x2="760.0" y2="297" stroke="#555" stroke-width="2" stroke-linecap="round" />
<text x="760.0" y="314" text-anchor="middle" font-size="13" font-weight="normal" fill="#444">100</text>
<text x="495" y="340" text-anchor="middle" font-size="13" font-weight="normal" fill="#555">Power wasted as heat in the line (W), log scale</text>
<text x="196" y="97" text-anchor="end" font-size="15" font-weight="bold" fill="#222">10 V line</text>
<text x="196" y="115" text-anchor="end" font-size="12" font-weight="normal" fill="#444">I = 100 W ÷ 10 V = 10 A</text>
<circle cx="760.0" cy="99" r="14" fill="#c0392b" stroke="#ffffff" stroke-width="3"/>
<text x="736.0" y="104" text-anchor="end" font-size="14" font-weight="bold" fill="#c0392b">100 W wasted: all of it (100%)</text>
<text x="196" y="172" text-anchor="end" font-size="15" font-weight="bold" fill="#222">100 V line</text>
<text x="196" y="190" text-anchor="end" font-size="12" font-weight="normal" fill="#444">I = 100 W ÷ 100 V = 1 A</text>
<circle cx="495.0" cy="174" r="14" fill="#e67e22" stroke="#ffffff" stroke-width="3"/>
<text x="519.0" y="179" text-anchor="start" font-size="14" font-weight="bold" fill="#e67e22">1 W wasted (1%)</text>
<text x="196" y="247" text-anchor="end" font-size="15" font-weight="bold" fill="#222">1,000 V line</text>
<text x="196" y="265" text-anchor="end" font-size="12" font-weight="normal" fill="#444">I = 100 W ÷ 1,000 V = 0.1 A</text>
<circle cx="230.0" cy="249" r="14" fill="#27ae60" stroke="#ffffff" stroke-width="3"/>
<text x="254.0" y="254" text-anchor="start" font-size="14" font-weight="bold" fill="#27ae60">0.01 W wasted (0.01%)</text>
<text x="410" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Loss = I² × R.  10× the voltage → 1/10 the current → 1/100 the loss.</text>
</svg>