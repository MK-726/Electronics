<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="redHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="lightHead" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4 L0 8 z" fill="#e6a700"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#ffffff"/>

  <!-- wires (closed loop) -->
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 175 V80 H290"/>
    <path d="M394 80 H560 V150"/>
    <path d="M560 205 V300 H120 V205"/>
  </g>

  <!-- battery -->
  <line x1="90" y1="175" x2="150" y2="175" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="103" y1="205" x2="137" y2="205" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="168" y="181" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="168" y="219" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="80" y="192" text-anchor="end" font-size="20" font-weight="bold" fill="#222">9 V</text>
  <text x="80" y="212" text-anchor="end" font-size="14" fill="#444">battery</text>

  <!-- resistor -->
  <path d="M290 80 H302 L310 60 L326 100 L342 60 L358 100 L374 60 L382 80 H394" stroke="#222" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="342" y="42" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">Resistor 330 Ω</text>
  <text x="342" y="128" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e8449">6 V across resistor</text>

  <!-- LED (pointing down: anode on top, cathode at bottom) -->
  <path d="M535 150 L585 150 L560 205 Z" fill="#ffd9d9" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <line x1="535" y1="205" x2="585" y2="205" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#e6a700" stroke-width="3" fill="none">
    <line x1="595" y1="165" x2="632" y2="135" marker-end="url(#lightHead)"/>
    <line x1="598" y1="188" x2="635" y2="158" marker-end="url(#lightHead)"/>
  </g>
  <text x="515" y="170" text-anchor="end" font-size="17" font-weight="bold" fill="#222">White LED</text>
  <text x="515" y="192" text-anchor="end" font-size="16" font-weight="bold" fill="#2471a3">3 V across LED</text>

  <!-- conventional current (clockwise) -->
  <line x1="180" y1="60" x2="250" y2="60" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="215" y="46" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">I ≈ 20 mA</text>
  <line x1="420" y1="326" x2="330" y2="326" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="375" y="352" text-anchor="middle" font-size="14" fill="#444">Same current everywhere in the loop (conventional direction)</text>

  <!-- equation -->
  <text x="340" y="250" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">9 V − 3 V = 6 V</text>
  <text x="340" y="276" text-anchor="middle" font-size="15" fill="#444">Supply − LED drop = resistor voltage</text>
</svg>
