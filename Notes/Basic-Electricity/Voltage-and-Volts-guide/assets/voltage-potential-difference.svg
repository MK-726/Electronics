<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 z" fill="#222"/></marker>
    <marker id="arrL" markerWidth="10" markerHeight="10" refX="2" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M10 0 L0 5 L10 10 z" fill="#222"/></marker>
  </defs>
  <rect width="680" height="280" fill="#ffffff"/>
  <g stroke="#b87333" stroke-width="5" stroke-linecap="round">
    <line x1="150" y1="120" x2="305" y2="120"/>
    <line x1="375" y1="120" x2="530" y2="120"/>
  </g>
  <line x1="305" y1="100" x2="305" y2="140" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <line x1="375" y1="85" x2="375" y2="155" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <text x="340" y="62" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">9 V BATTERY</text>
  <circle cx="150" cy="120" r="14" fill="#2471a3" stroke="#222" stroke-width="2"/>
  <circle cx="530" cy="120" r="14" fill="#c0392b" stroke="#222" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">−</text>
  <text x="530" y="128" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">+</text>
  <text x="150" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">− terminal</text>
  <text x="530" y="88" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">+ terminal</text>
  <g stroke="#777" stroke-width="2" stroke-dasharray="5 5">
