    <line x1="530" y1="138" x2="530" y2="200"/>
  </g>
  <line x1="158" y1="205" x2="522" y2="205" stroke="#222" stroke-width="3" marker-start="url(#arrL)" marker-end="url(#arrR)"/>
  <text x="340" y="236" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Potential difference = 9 V</text>
  <text x="340" y="260" text-anchor="middle" font-size="15" fill="#444">(9 joules of energy per coulomb of charge)</text>
