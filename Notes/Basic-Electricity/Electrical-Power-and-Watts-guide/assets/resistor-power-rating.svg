<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="280" fill="#ffffff"/>
  <text x="350" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Heat produced vs. resistor power rating</text>

  <!-- scale: 80 px per watt, bars start at x=240 -->
  <line x1="240" y1="48" x2="240" y2="248" stroke="#999" stroke-width="2"/>

  <!-- row 1: quarter-watt resistor rating -->
  <text x="228" y="78" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Resistor used</text>
  <text x="228" y="96" text-anchor="end" font-size="14" fill="#444">rated 1/4 W</text>
  <rect x="240" y="62" width="20" height="36" fill="#2471a3"/>
  <text x="272" y="86" font-size="16" font-weight="bold" fill="#2471a3">0.25 W</text>

  <!-- row 2: heat produced -->
  <text x="228" y="148" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Heat produced</text>
  <text x="228" y="166" text-anchor="end" font-size="14" fill="#444">137² ÷ 6,800</text>
  <rect x="240" y="132" width="220.8" height="36" fill="#c0392b"/>
  <text x="472" y="156" font-size="16" font-weight="bold" fill="#c0392b">2.76 W: 11× over rating</text>

  <!-- row 3: suitable resistor -->
  <text x="228" y="218" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Suitable resistor</text>
  <text x="228" y="236" text-anchor="end" font-size="14" fill="#444">rated 5 W</text>
  <rect x="240" y="202" width="400" height="36" fill="#1e8449"/>
  <text x="650" y="226" font-size="16" font-weight="bold" fill="#1e8449">5 W</text>
</svg>
