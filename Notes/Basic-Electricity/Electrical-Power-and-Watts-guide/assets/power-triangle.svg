<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 320" width="730" height="320" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="730" height="320" fill="#ffffff"/>

  <!-- triangle -->
  <path d="M180 40 L60 250 L300 250 Z" fill="#fdf3e3" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <line x1="109" y1="165" x2="251" y2="165" stroke="#222" stroke-width="4"/>
  <line x1="180" y1="165" x2="180" y2="250" stroke="#222" stroke-width="4"/>
  <text x="180" y="138" text-anchor="middle" font-size="56" font-weight="bold" fill="#d35400">P</text>
  <text x="130" y="228" text-anchor="middle" font-size="56" font-weight="bold" fill="#c0392b">V</text>
  <text x="240" y="228" text-anchor="middle" font-size="56" font-weight="bold" fill="#2471a3">I</text>
  <text x="180" y="290" text-anchor="middle" font-size="15" fill="#444">Cover the one you want to find</text>

  <!-- formulas -->
  <g font-size="32" font-weight="bold" fill="#222">
    <text x="400" y="70"><tspan fill="#d35400">P</tspan> = <tspan fill="#c0392b">V</tspan> × <tspan fill="#2471a3">I</tspan></text>
    <text x="400" y="125"><tspan fill="#c0392b">V</tspan> = <tspan fill="#d35400">P</tspan> ÷ <tspan fill="#2471a3">I</tspan></text>
    <text x="400" y="180"><tspan fill="#2471a3">I</tspan> = <tspan fill="#d35400">P</tspan> ÷ <tspan fill="#c0392b">V</tspan></text>
  </g>
  <line x1="400" y1="205" x2="640" y2="205" stroke="#ccc" stroke-width="2"/>
  <text x="400" y="248" font-size="32" font-weight="bold" fill="#222"><tspan fill="#d35400">P</tspan> = <tspan fill="#c0392b">V</tspan>² ÷ <tspan fill="#1e8449">R</tspan></text>
  <text x="400" y="274" font-size="15" fill="#444">Use when you know voltage and resistance</text>
</svg>
