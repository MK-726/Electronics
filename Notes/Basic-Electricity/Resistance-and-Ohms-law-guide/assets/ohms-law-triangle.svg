<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="680" height="320" fill="#ffffff"/>

  <!-- triangle -->
  <path d="M180 40 L60 250 L300 250 Z" fill="#eef4fb" stroke="#222" stroke-width="4" stroke-linejoin="round"/>
  <line x1="109" y1="165" x2="251" y2="165" stroke="#222" stroke-width="4"/>
  <line x1="180" y1="165" x2="180" y2="250" stroke="#222" stroke-width="4"/>
  <text x="180" y="138" text-anchor="middle" font-size="56" font-weight="bold" fill="#c0392b">V</text>
  <text x="130" y="228" text-anchor="middle" font-size="56" font-weight="bold" fill="#2471a3">I</text>
  <text x="240" y="228" text-anchor="middle" font-size="56" font-weight="bold" fill="#1e8449">R</text>
  <text x="180" y="290" text-anchor="middle" font-size="15" fill="#444">Cover the one you want to find</text>

  <!-- formulas -->
  <g font-size="34" font-weight="bold" fill="#222">
    <text x="400" y="95"><tspan fill="#c0392b">V</tspan> = <tspan fill="#2471a3">I</tspan> × <tspan fill="#1e8449">R</tspan></text>
    <text x="400" y="165"><tspan fill="#2471a3">I</tspan> = <tspan fill="#c0392b">V</tspan> ÷ <tspan fill="#1e8449">R</tspan></text>
    <text x="400" y="235"><tspan fill="#1e8449">R</tspan> = <tspan fill="#c0392b">V</tspan> ÷ <tspan fill="#2471a3">I</tspan></text>
  </g>
  <g font-size="14" fill="#444">
    <text x="400" y="115">Voltage = Current × Resistance</text>
    <text x="400" y="185">Current = Voltage ÷ Resistance</text>
    <text x="400" y="255">Resistance = Voltage ÷ Current</text>
  </g>
</svg>
