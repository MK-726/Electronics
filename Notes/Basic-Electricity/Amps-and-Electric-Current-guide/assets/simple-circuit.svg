<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="680" height="380" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="redHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <marker id="blueHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2471a3"/>
    </marker>
  </defs>
  <rect width="680" height="380" fill="#ffffff"/>

  <!-- closed loop wires -->
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 175 V90 H540 V158"/>
    <path d="M540 222 V290 H390"/>
    <path d="M290 290 H140 V205"/>
  </g>

  <!-- battery (cell symbol with poles) -->
  <line x1="110" y1="175" x2="170" y2="175" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="123" y1="205" x2="157" y2="205" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="188" y="181" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="188" y="219" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="98" y="196" text-anchor="end" font-size="16" font-weight="bold" fill="#222">BATTERY</text>

  <!-- light bulb (ON) -->
  <circle cx="540" cy="190" r="32" fill="#fff3b0" stroke="#222" stroke-width="3"/>
  <path d="M530 205 V190 C530 176 550 176 550 190 V205" stroke="#222" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <g stroke="#f1c40f" stroke-width="3" stroke-linecap="round">
    <line x1="513" y1="163" x2="506" y2="156"/>
    <line x1="567" y1="163" x2="574" y2="156"/>
    <line x1="513" y1="217" x2="506" y2="224"/>
    <line x1="567" y1="217" x2="574" y2="224"/>
  </g>
  <text x="485" y="195" text-anchor="end" font-size="16" font-weight="bold" fill="#222">LIGHT (ON)</text>

  <!-- switch (closed) -->
  <circle cx="290" cy="290" r="6" fill="#222"/>
  <circle cx="390" cy="290" r="6" fill="#222"/>
  <line x1="290" y1="290" x2="390" y2="290" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <text x="340" y="268" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">SWITCH (closed)</text>

  <!-- conventional current: clockwise, + to - (red, outside loop) -->
  <g stroke="#c0392b" stroke-width="3" fill="none">
    <line x1="300" y1="64" x2="380" y2="64" marker-end="url(#redHead)"/>
    <line x1="582" y1="105" x2="582" y2="175" marker-end="url(#redHead)"/>
    <line x1="380" y1="320" x2="300" y2="320" marker-end="url(#redHead)"/>
    <line x1="100" y1="150" x2="100" y2="110" marker-end="url(#redHead)"/>
  </g>

  <!-- electron flow: counter-clockwise, - to + (blue, inside loop) -->
  <g stroke="#2471a3" stroke-width="3" fill="none" stroke-dasharray="8 5">
    <line x1="380" y1="118" x2="300" y2="118" marker-end="url(#blueHead)"/>
    <line x1="498" y1="170" x2="498" y2="110" marker-end="url(#blueHead)"/>
    <line x1="430" y1="258" x2="500" y2="258" marker-end="url(#blueHead)"/>
    <line x1="182" y1="235" x2="182" y2="272" marker-end="url(#blueHead)"/>
  </g>

  <!-- legend -->
  <g font-size="15" font-weight="bold">
    <line x1="60" y1="358" x2="110" y2="358" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
    <text x="122" y="363" fill="#c0392b">Conventional current (+ to −)</text>
    <line x1="360" y1="358" x2="410" y2="358" stroke="#2471a3" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#blueHead)"/>
    <text x="422" y="363" fill="#2471a3">Electron flow (− to +)</text>
  </g>
</svg>
