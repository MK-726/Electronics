<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" width="760" height="370" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="flowHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1b4f72"/>
    </marker>
  </defs>
  <rect width="760" height="370" fill="#ffffff"/>
  <line x1="390" y1="20" x2="390" y2="350" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- SERIES -->
  <text x="200" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">SERIES: one pipe, two narrow sections</text>
  <path d="M40 80 H120 V92 H190 V80 H240 V100 H310 V80 H360 V130 H310 V110 H240 V130 H190 V118 H120 V130 H40 Z" fill="#aed6f1" stroke="#2471a3" stroke-width="3" stroke-linejoin="round"/>
  <line x1="60" y1="58" x2="340" y2="58" stroke="#1b4f72" stroke-width="3" marker-end="url(#flowHead)"/>
  <text x="200" y="50" text-anchor="middle" font-size="14" fill="#1b4f72">flow of water = current</text>
  <text x="155" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">R1 1 kΩ</text>
  <text x="275" y="156" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">R2 2 kΩ</text>
  <text x="200" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Total R = R1 + R2 = 3 kΩ</text>
  <text x="200" y="235" text-anchor="middle" font-size="14" fill="#444">Same flow through every section</text>
  <text x="200" y="258" text-anchor="middle" font-size="14" fill="#444">Pressure (voltage) is shared across the parts</text>

  <!-- PARALLEL -->
  <text x="570" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222">PARALLEL: two pipes side by side</text>
  <g fill="#2471a3" stroke="#2471a3" stroke-width="6" stroke-linejoin="round">
    <rect x="420" y="130" width="60" height="40"/>
    <rect x="470" y="80" width="20" height="140"/>
    <rect x="490" y="80" width="40" height="40"/>
    <rect x="530" y="92" width="70" height="16"/>
    <rect x="600" y="80" width="40" height="40"/>
    <rect x="490" y="180" width="40" height="40"/>
    <rect x="530" y="196" width="70" height="8"/>
    <rect x="600" y="180" width="40" height="40"/>
    <rect x="640" y="80" width="20" height="140"/>
    <rect x="650" y="130" width="60" height="40"/>
  </g>
  <g fill="#aed6f1">
    <rect x="420" y="130" width="60" height="40"/>
    <rect x="470" y="80" width="20" height="140"/>
    <rect x="490" y="80" width="40" height="40"/>
    <rect x="530" y="92" width="70" height="16"/>
    <rect x="600" y="80" width="40" height="40"/>
    <rect x="490" y="180" width="40" height="40"/>
    <rect x="530" y="196" width="70" height="8"/>
    <rect x="600" y="180" width="40" height="40"/>
    <rect x="640" y="80" width="20" height="140"/>
    <rect x="650" y="130" width="60" height="40"/>
  </g>
  <line x1="430" y1="150" x2="468" y2="150" stroke="#1b4f72" stroke-width="3" marker-end="url(#flowHead)"/>
  <line x1="664" y1="150" x2="702" y2="150" stroke="#1b4f72" stroke-width="3" marker-end="url(#flowHead)"/>
  <text x="565" y="66" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">R1 1 kΩ</text>
  <text x="565" y="246" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">R2 2 kΩ</text>
  <text x="565" y="290" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Total R ≈ 667 Ω, lower than either branch</text>
  <text x="565" y="315" text-anchor="middle" font-size="14" fill="#444">Same pressure (voltage) across each branch</text>
  <text x="565" y="338" text-anchor="middle" font-size="14" fill="#444">Flow splits: more goes through the wider R1</text>
</svg>
