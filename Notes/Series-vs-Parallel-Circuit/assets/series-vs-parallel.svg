<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 400" width="900" height="400" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="redHead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/>
    </marker>
    <g id="bulb">
      <circle r="26" fill="#fff3b0" stroke="#222" stroke-width="3"/>
      <path d="M-10 12 V-2 C-10 -14 10 -14 10 -2 V12" stroke="#222" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
      <g stroke="#f1c40f" stroke-width="3" stroke-linecap="round">
        <line x1="-23" y1="-23" x2="-31" y2="-31"/>
        <line x1="23" y1="-23" x2="31" y2="-31"/>
        <line x1="-23" y1="23" x2="-31" y2="31"/>
        <line x1="23" y1="23" x2="31" y2="31"/>
      </g>
    </g>
  </defs>
  <rect width="900" height="400" fill="#ffffff"/>
  <line x1="445" y1="20" x2="445" y2="380" stroke="#ccc" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- SERIES -->
  <text x="250" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">SERIES</text>
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 190 V100 H174"/>
    <path d="M226 100 H294"/>
    <path d="M346 100 H410 V320 H90 V225"/>
  </g>
  <line x1="60" y1="190" x2="120" y2="190" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="73" y1="225" x2="107" y2="225" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="132" y="196" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="132" y="236" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="52" y="212" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Cell</text>
  <use xlink:href="#bulb" x="200" y="100"/>
  <use xlink:href="#bulb" x="320" y="100"/>
  <text x="200" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Bulb 1</text>
  <text x="320" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Bulb 2</text>
  <line x1="244" y1="64" x2="282" y2="64" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="263" y="54" text-anchor="middle" font-size="16" font-weight="bold" fill="#c0392b">I</text>
  <text x="250" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">One loop: same current through both bulbs</text>

  <!-- PARALLEL -->
  <text x="680" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">PARALLEL</text>
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 190 V90 H780"/>
    <path d="M520 225 V320 H780"/>
    <path d="M640 90 V179"/>
    <path d="M640 231 V320"/>
    <path d="M780 90 V179"/>
    <path d="M780 231 V320"/>
  </g>
  <line x1="490" y1="190" x2="550" y2="190" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="503" y1="225" x2="537" y2="225" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="562" y="196" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="562" y="236" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="482" y="212" text-anchor="end" font-size="16" font-weight="bold" fill="#222">Cell</text>
  <use xlink:href="#bulb" x="640" y="205"/>
