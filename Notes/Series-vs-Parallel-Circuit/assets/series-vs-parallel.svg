  <text x="680" y="212" font-size="15" font-weight="bold" fill="#222">Bulb 1</text>
  <text x="820" y="212" font-size="15" font-weight="bold" fill="#222">Bulb 2</text>
  <g fill="#222"><circle cx="640" cy="90" r="6"/><circle cx="640" cy="320" r="6"/><circle cx="780" cy="90" r="6"/><circle cx="780" cy="320" r="6"/></g>
  <line x1="548" y1="68" x2="608" y2="68" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="578" y="54" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">I total</text>
  <line x1="610" y1="120" x2="610" y2="162" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="598" y="146" text-anchor="end" font-size="18" font-weight="bold" fill="#c0392b">I₁</text>
  <line x1="750" y1="120" x2="750" y2="162" stroke="#c0392b" stroke-width="3" marker-end="url(#redHead)"/>
  <text x="738" y="146" text-anchor="end" font-size="18" font-weight="bold" fill="#c0392b">I₂</text>
  <text x="680" y="372" text-anchor="middle" font-size="15" font-weight="bold" fill="#222">Current splits: same voltage across each bulb</text>
</svg>
