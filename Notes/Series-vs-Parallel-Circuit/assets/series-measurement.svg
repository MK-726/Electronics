<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="760" height="430" fill="#ffffff"/>
  <!-- wires -->
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 195 V100 H250"/>
    <path d="M350 100 H430"/>
    <path d="M530 100 H640 V330 H406"/>
    <path d="M354 330 H120 V225"/>
  </g>
  <!-- battery -->
  <line x1="90" y1="195" x2="150" y2="195" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="103" y1="225" x2="137" y2="225" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="168" y="201" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="168" y="239" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="82" y="216" text-anchor="end" font-size="18" font-weight="bold" fill="#222">9 V</text>
  <!-- resistors -->
  <g stroke="#222" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M250 100 H258 L266 80 L282 120 L298 80 L314 120 L330 80 L338 100 H350"/>
    <path d="M430 100 H438 L446 80 L462 120 L478 80 L494 120 L510 80 L518 100 H530"/>
  </g>
  <text x="300" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">R1 = 1 kΩ</text>
  <text x="480" y="60" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">R2 = 2 kΩ</text>

  <!-- voltmeters (across each resistor = parallel) -->
  <g stroke="#2471a3" stroke-width="3" stroke-dasharray="7 5" fill="none">
    <path d="M280 195 L254 100"/><path d="M320 195 L346 100"/>
    <path d="M460 195 L434 100"/><path d="M500 195 L526 100"/>
  </g>
  <g fill="#2471a3">
    <circle cx="254" cy="100" r="5"/><circle cx="346" cy="100" r="5"/>
    <circle cx="434" cy="100" r="5"/><circle cx="526" cy="100" r="5"/>
  </g>
  <circle cx="300" cy="215" r="26" fill="#dbeafe" stroke="#2471a3" stroke-width="3"/>
  <text x="300" y="224" text-anchor="middle" font-size="24" font-weight="bold" fill="#2471a3">V</text>
  <circle cx="480" cy="215" r="26" fill="#dbeafe" stroke="#2471a3" stroke-width="3"/>
  <text x="480" y="224" text-anchor="middle" font-size="24" font-weight="bold" fill="#2471a3">V</text>
  <text x="300" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">reads 3 V</text>
  <text x="480" y="266" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">reads 6 V</text>
  <text x="390" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">3 V + 6 V = 9 V</text>

  <!-- ammeter (in the loop = series) -->
  <circle cx="380" cy="330" r="26" fill="#dcfce7" stroke="#1e8449" stroke-width="3"/>
  <text x="380" y="339" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e8449">A</text>
  <text x="380" y="378" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e8449">reads 3 mA (same anywhere in the loop)</text>

  <text x="380" y="414" text-anchor="middle" font-size="15" fill="#444">Voltmeters go across a part (parallel). The ammeter goes into the loop (series).</text>
</svg>
