<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="520" height="280" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="520" height="280" fill="#ffffff"/>
  <!-- wires -->
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 110 V50 H260"/>
    <path d="M340 50 H410 V110"/>
    <path d="M410 170 V230 H260"/>
    <path d="M180 230 H110 V170"/>
  </g>
  <!-- battery -->
  <rect x="80" y="110" width="60" height="60" rx="6" fill="#e8eef7" stroke="#334" stroke-width="3"/>
  <text x="110" y="148" text-anchor="middle" font-size="16" font-weight="bold" fill="#334">BATTERY</text>
  <text x="110" y="104" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">+</text>
  <text x="110" y="198" text-anchor="middle" font-size="26" font-weight="bold" fill="#2c3e50">−</text>
  <!-- bulb -->
  <circle cx="410" cy="140" r="30" fill="#fff3b0" stroke="#334" stroke-width="3"/>
  <path d="M395 150 l8 -14 l8 14 l8 -14" stroke="#334" stroke-width="2.5" fill="none"/>
  <text x="460" y="145" font-size="16" font-weight="bold" fill="#334">LIGHT</text>
  <!-- switch -->
  <circle cx="260" cy="230" r="5" fill="#334"/>
  <circle cx="180" cy="230" r="5" fill="#334"/>
  <line x1="260" y1="230" x2="196" y2="205" stroke="#334" stroke-width="4" stroke-linecap="round"/>
  <text x="220" y="258" text-anchor="middle" font-size="16" font-weight="bold" fill="#334">SWITCH (open = OFF)</text>
  <!-- arrows -->
  <g fill="#2980b9" font-size="13" font-weight="bold">
    <path d="M170 38 l14 -7 v14 z"/>
    <text x="150" y="28">Electron flow (− to +)</text>
  </g>
  <text x="290" y="40" font-size="13" fill="#7f8c8d" text-anchor="middle"></text>
</svg>
