<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 440" width="620" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="620" height="440" fill="#ffffff"/>
  <!-- wires -->
  <g stroke="#b87333" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 195 V90 H174"/>
    <path d="M226 90 H480"/>
    <path d="M120 225 V360 H480"/>
    <path d="M300 90 V116"/>
    <path d="M480 90 V116"/>
  </g>
  <!-- resistors (vertical) with wires -->
  <g stroke="#222" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M300 164 V193 L280 201 L320 217 L280 233 L320 249 L280 265 L300 273 V360"/>
    <path d="M480 164 V193 L460 201 L500 217 L460 233 L500 249 L460 265 L480 273 V360"/>
  </g>
  <g fill="#222"><circle cx="300" cy="90" r="6"/><circle cx="480" cy="90" r="6"/><circle cx="300" cy="360" r="6"/><circle cx="480" cy="360" r="6"/></g>

  <!-- battery -->
  <line x1="90" y1="195" x2="150" y2="195" stroke="#222" stroke-width="5" stroke-linecap="round"/>
  <line x1="103" y1="225" x2="137" y2="225" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <text x="168" y="201" font-size="24" font-weight="bold" fill="#c0392b">+</text>
  <text x="168" y="239" font-size="30" font-weight="bold" fill="#2471a3">−</text>
  <text x="82" y="216" text-anchor="end" font-size="18" font-weight="bold" fill="#222">9 V</text>

  <!-- resistor labels -->
  <text x="268" y="238" text-anchor="end" font-size="16" font-weight="bold" fill="#222">R1 = 1 kΩ</text>
  <text x="512" y="238" font-size="16" font-weight="bold" fill="#222">R2 = 2 kΩ</text>

  <!-- ammeters (in line = series with what they measure) -->
  <g fill="#dcfce7" stroke="#1e8449" stroke-width="3">
    <circle cx="200" cy="90" r="26"/>
    <circle cx="300" cy="140" r="24"/>
    <circle cx="480" cy="140" r="24"/>
  </g>
  <g font-size="22" font-weight="bold" fill="#1e8449" text-anchor="middle">
    <text x="200" y="98">A</text>
    <text x="300" y="148">A</text>
    <text x="480" y="148">A</text>
  </g>
  <text x="200" y="52" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">A (total)</text>
  <text x="200" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e8449">13.5 mA</text>
  <text x="268" y="145" text-anchor="end" font-size="14" font-weight="bold" fill="#222">A (R1)</text>
  <text x="330" y="145" font-size="16" font-weight="bold" fill="#1e8449">9 mA</text>
  <text x="448" y="145" text-anchor="end" font-size="14" font-weight="bold" fill="#222">A (R2)</text>
  <text x="512" y="145" font-size="16" font-weight="bold" fill="#1e8449">4.5 mA</text>

  <!-- voltmeter (across both = parallel) -->
  <g stroke="#2471a3" stroke-width="3" stroke-dasharray="7 5" fill="none">
    <path d="M390 199 V90"/><path d="M390 251 V360"/>
  </g>
  <g fill="#2471a3"><circle cx="390" cy="90" r="5"/><circle cx="390" cy="360" r="5"/></g>
  <circle cx="390" cy="225" r="26" fill="#dbeafe" stroke="#2471a3" stroke-width="3"/>
  <text x="390" y="234" text-anchor="middle" font-size="24" font-weight="bold" fill="#2471a3">V</text>
  <text x="390" y="298" text-anchor="middle" font-size="16" font-weight="bold" fill="#2471a3">9 V</text>

  <text x="310" y="402" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">I total = I₁ + I₂ = 9 + 4.5 = 13.5 mA</text>
  <text x="310" y="426" text-anchor="middle" font-size="15" fill="#444">Same 9 V across the supply and both branches</text>
</svg>
